      });
    };
  });
}

/* шаг 2: содержимое */
function asstContent(target){
  asst = target;
  asstBack(
    '<h3>Что записать?</h3>' +
    '<p class="sub">Пойдёт в «<b>' + esc(target.label) + '</b>».</p>' +
    '<div class="asr-box" id="asrBox" contenteditable="true" data-ph="Наберите или продиктуйте микрофоном на клавиатуре"></div>' +
    (voiceSupported ? '<button class="ghost-link" id="vToggle">Записать голосом</button>' : "") +
    '<p class="hint" id="kbHint">Если запись подведёт — на клавиатуре телефона есть свой микрофон, он диктует в это же поле.</p>' +
    '<button class="primary" id="asstSave" disabled>Сохранить</button>',
    "assistant", () => { stopRec(true); (target.back || openAssistant)(); });

  const box = document.getElementById("asrBox");
  const saveBtn = document.getElementById("asstSave");
  const sync = () => { saveBtn.disabled = !box.textContent.trim(); };
  box.addEventListener("input", sync);

  let base = "";
  const sinkFn = text => {
    if (!text) return;
    box.textContent = (base ? base + " " : "") + text;
    sync();
  };
  const tg = document.getElementById("vToggle");
  if (tg) tg.onclick = () => {
    if (recording){
      stopRec(false); sync();
      tg.textContent = "Записать голосом";
      return;
    }
    base = box.textContent.trim();
    if (!startRec(sinkFn, sync)){ showRecError(NO_VOICE); return; }
    tg.textContent = "Остановить запись";
  };
  saveBtn.onclick = () => {
    stopRec(true);
    const text = box.textContent.replace(/\s+/g," ").trim();
    if (!text) return;
    if (target.scope === "day" && target.quad !== undefined){
      const cut = text.indexOf(".");
      const title = cut > 0 && cut < 60 ? text.slice(0, cut) : text.slice(0, 60);
      state.dayNotes.unshift({ id:uid(), title:cap(title.trim()),
        body:(cut > 0 && cut < 60 ? text.slice(cut + 1).trim() : (text.length > 60 ? text : "")),
        quad:target.quad, done:false, ts:Date.now() });
      save(); renderAll();
    } else addNote(target.scope, target.owner, cap(text));
    buzz("medium");
    closeSheet();
  };
  /* запись стартует сразу: место уже выбрано, остаётся продиктовать */
  if (voiceSupported && tg) tg.onclick();
  else box.focus();
}

function reviewTargets(){
  const list = [{ v:"day", label:"Заметка на день" }];
  state.subjects.forEach(s => list.push({ v:s.id, label:"Предмет: " + s.name }));
  review.items.forEach(it => {
    if (it.kind === "subject" && !it.existingId)
      list.push({ v:it.tmp, label:"Новый предмет: " + (it.name || "без названия") });
  });
  return list;
}
function renderReview(){
  const subs = review.items.filter(i => i.kind === "subject").length;
  const nts = review.items.filter(i => i.kind === "note").length;
  const summary = [
    subs ? subs + " " + plural(subs, "предмет", "предмета", "предметов") : "",
    nts ? nts + " " + plural(nts, "заметка", "заметки", "заметок") : ""
  ].filter(Boolean).join(", ");

  const cards = review.items.map((it, i) => {
    if (it.kind === "subject"){
      const c = it.color || PALETTE[0];
      return '<div class="rv" data-i="' + i + '">' +
        '<div class="rv-head"><span class="rv-tag" style="background:' + tint(c,.16) + ';color:' + c + '">' +
          (it.existingId ? "Дополнить предмет" : "Новый предмет") + '</span>' +
          '<button class="del" data-rv-del="' + i + '" aria-label="Убрать">' + ICON.trash + '</button></div>' +
        '<input class="field" data-f="name" placeholder="Название предмета" value="' + esc(it.name) + '">' +
        '<input class="field" data-f="teacher" placeholder="Преподаватель" value="' + esc(it.teacher) + '">' +
        '<input class="field" data-f="room" placeholder="Аудитория" value="' + esc(it.room) + '">' +
      '</div>';
    }
    const opts = reviewTargets().map(t =>
      '<option value="' + t.v + '"' + (t.v === it.target ? " selected" : "") + '>' + esc(t.label) + '</option>').join("");
    return '<div class="rv" data-i="' + i + '">' +
      '<div class="rv-head"><span class="rv-tag" style="background:var(--sheet);color:var(--text-3)">Заметка</span>' +
        '<button class="del" data-rv-del="' + i + '" aria-label="Убрать">' + ICON.trash + '</button></div>' +
      '<textarea data-f="text">' + esc(it.text) + '</textarea>' +
      '<select class="field" data-f="target">' + opts + '</select>' +
    '</div>';
  }).join("");

  showSheet(
    '<h3>Проверьте разбор</h3>' +
    '<p class="rv-summary">Нашёл: ' + (summary || "ничего") + '. Поправьте текст или смените адрес заметки — сохранится только то, что здесь.</p>' +
    cards +
    '<button class="primary" id="rvSave">Сохранить</button>' +
    '<button class="ghost" id="rvBack">Вернуться к тексту</button>', "review");

  document.getElementById("rvSave").onclick = saveReview;
  document.getElementById("rvBack").onclick = () => {
    syncReview();
    const raw = review.raw;
    openAssistant();
    stopRec(true);
    const box = document.getElementById("asrBox");
    if (box){
      box.textContent = raw;
      asrText = raw;
      const go = document.getElementById("asrGo");
      if (go) go.disabled = !raw;
    }
  };
  sheet.scrollTop = 0;
}
function syncReview(){
  sheetBody.querySelectorAll(".rv").forEach(card => {
    const it = review.items[+card.dataset.i];
    if (!it) return;
    card.querySelectorAll("[data-f]").forEach(el => { it[el.dataset.f] = el.value.trim(); });
  });
}
function saveReview(){
  syncReview();
  const map = {};
  review.items.forEach(it => {
    if (it.kind !== "subject") return;
    if (it.existingId){
      const s = subjById(it.existingId);
      if (s){
        if (it.name) s.name = it.name;
        if (it.teacher) s.teacher = it.teacher;
        if (it.room) s.room = it.room;
        map[it.tmp] = s.id;
      }
    } else if (it.name || it.teacher || it.room){
      const id = uid();
      state.subjects.push({ id:id, name:it.name || "Без названия", teacher:it.teacher, room:it.room, color:it.color, notes:[] });
      map[it.tmp] = id;
    }
  });
  review.items.forEach(it => {
    if (it.kind !== "note" || !it.text) return;
    let target = map[it.target] || it.target;
    const note = { id:uid(), text:it.text, ts:Date.now() };
    if (target === "day"){ note.done = false; state.dayNotes.unshift(note); return; }
    const s = subjById(target);
    if (s) s.notes.unshift(note);
    else { note.done = false; state.dayNotes.unshift(note); }
  });
  save(); buzz("medium"); renderAll(); closeSheet();
}
sheetBody.addEventListener("click", e => {
  const imp = e.target.closest("[data-imp-del]");
  if (imp && importData){
    importData.subjects.splice(+imp.dataset.impDel, 1);
    importData.total = importData.subjects.reduce((n,s) => n + s.count, 0);
    buzz("light");
    if (importData.subjects.length) renderImport(); else closeSheet();
    return;
  }
  const d = e.target.closest("[data-rv-del]");
  if (!d || !review) return;
  syncReview();
  review.items.splice(+d.dataset.rvDel, 1);
  buzz("light");
  if (review.items.length) renderReview(); else closeSheet();
});

const LESSON_KINDS = /(ЛЕКЦИЯ|СЕМИНАР|ЛАБОРАТОРН[А-ЯЁA-Z]*|ПРАКТИЧЕСК[А-ЯЁA-Z]*|ПРАКТИКА|КОНСУЛЬТАЦИЯ|ЗАЧ[ЁЕ]Т|ЭКЗАМЕН)/i;

function loadScript(src){
  return new Promise((res, rej) => {
    if (document.querySelector('script[src="' + src + '"]')) return res();
    const s = document.createElement("script");
    s.src = src; s.onload = () => res(); s.onerror = () => rej(new Error("нет доступа к библиотеке"));
    document.head.appendChild(s);
  });
}

/* Многие вузовские PDF собраны так: байты текста в кодировке cp1251,
   а шрифт объявлен как WinAnsi (cp1252) и без карты ToUnicode.
   Браузер честно следует объявлению и выдаёт «Ôèçè÷åñêàÿ êóëüòóðà».
   Здесь мы это распознаём и возвращаем кириллицу обратно. */
const CP1252_HI = {
  0x20AC:0x80, 0x201A:0x82, 0x0192:0x83, 0x201E:0x84, 0x2026:0x85, 0x2020:0x86,
  0x2021:0x87, 0x02C6:0x88, 0x2030:0x89, 0x0160:0x8A, 0x2039:0x8B, 0x0152:0x8C,
  0x017D:0x8E, 0x2018:0x91, 0x2019:0x92, 0x201C:0x93, 0x201D:0x94, 0x2022:0x95,
  0x2013:0x96, 0x2014:0x97, 0x02DC:0x98, 0x2122:0x99, 0x0161:0x9A, 0x203A:0x9B,
  0x0153:0x9C, 0x017E:0x9E, 0x0178:0x9F
};
function looksMojibake(s){
  let hi = 0, cyr = 0;
  for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    if ((c >= 0x0410 && c <= 0x044F) || c === 0x0401 || c === 0x0451) cyr++;
    else if ((c >= 0xC0 && c <= 0xFF) || CP1252_HI[c] !== undefined) hi++;
  }
  return hi >= 2 && hi > cyr;
}
let CP1251_CHARS = null;
function cp1251Char(byte){
  if (CP1251_CHARS === null){
    try { CP1251_CHARS = new TextDecoder("windows-1251")
      .decode(new Uint8Array(Array.from({length:128}, (_,k) => k + 128))); }
    catch(e){ CP1251_CHARS = ""; }
  }
  return CP1251_CHARS ? CP1251_CHARS[byte - 128] : null;
}
/* посимвольно: неизвестный символ просто остаётся как есть, а не рушит всю строку */
function fixMojibake(s){
  if (!s || !looksMojibake(s)) return s;
  let out = "";
  for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    let byte = null;
    if (c >= 0xA0 && c <= 0xFF) byte = c;
    else if (CP1252_HI[c] !== undefined) byte = CP1252_HI[c];
    if (byte === null){ out += s[i]; continue; }
    const ch = cp1251Char(byte);
    out += (ch && ch !== "\uFFFD") ? ch : s[i];
  }
  return /[А-Яа-яЁё]/.test(out) ? out : s;
}

async function pdfWorkerSrc(){
  /* воркер с чужого домена в вебвью Telegram часто блокируется —
     скачиваем его и запускаем как локальный blob */
  try {
    const r = await fetch(LIB.pdfWorker);
    if (!r.ok) throw 0;
    return URL.createObjectURL(new Blob([await r.text()], { type:"text/javascript" }));
  } catch(e){ return LIB.pdfWorker; }
}
/* Возвращаем несколько вариантов текста: разные PDF по-разному хранят порядок,
   дальше разборщик сам выберет тот, из которого получилось больше пар. */
async function pdfToTexts(file){
  await loadScript(LIB.pdf);
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = await pdfWorkerSrc();
  const pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  let byRows = "", byTight = "", byOrder = "";
  for (let p = 1; p <= pdf.numPages; p++){
    const content = await (await pdf.getPage(p)).getTextContent();
    const items = content.items
      .filter(it => it.str)
      .map(it => ({ x:it.transform[4], y:it.transform[5], w:it.width || 0, s:fixMojibake(it.str) }));

    items.forEach(it => { byOrder += it.s + " "; });
    byOrder += "\n";

    const lines = [];
    items.forEach(it => {
      let row = null;
      for (let i = 0; i < lines.length; i++){
        if (Math.abs(lines[i].y - it.y) <= 3.5){ row = lines[i]; break; }
      }
      if (!row){ row = { y:it.y, items:[] }; lines.push(row); }
      row.items.push(it);
    });
    lines.sort((a,b) => b.y - a.y);
    lines.forEach(row => {
      row.items.sort((a,b) => a.x - b.x);
      let gap = "", tight = "";
      row.items.forEach((it, i) => {
        if (i){
          const prev = row.items[i-1];
          /* пробел — только если между КОНЦОМ предыдущего куска и началом текущего
             реальный зазор; раньше сравнивалисьдва начала и пробел лез всюду */
          const free = it.x - (prev.x + (prev.w || 0));
          if (free > 0.8 && !/\s$/.test(gap) && !/^\s/.test(it.s)) gap += " ";
        }
        gap += it.s;
        tight += it.s;
      });
      byRows += gap.replace(/[ \t]+/g, " ").trim() + "\n";
      byTight += tight.replace(/[ \t]+/g, " ").trim() + "\n";
    });
  }
  return [byRows, byTight, byOrder];
}

/* Файл -> набор вариантов текста либо строки таблицы */
async function extractFile(file){
  const name = (file.name || "").toLowerCase();
  if (name.endsWith(".pdf")) return { kind:"text", texts: await pdfToTexts(file) };
  if (name.endsWith(".docx")){
    await loadScript(LIB.docx);
    const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return { kind:"text", texts:[fixMojibake(r.value)] };
  }
  if (/\.(xlsx|xlsm|xls|csv)$/.test(name)){
    await loadScript(LIB.xlsx);
    const wb = window.XLSX.read(await file.arrayBuffer(), { type:"array", cellDates:true });
    let rows = [];
    wb.SheetNames.forEach(n => {
      rows = rows.concat(window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, blankrows:false, defval:"", raw:false }));
    });
    return { kind:"rows", rows:rows.map(r => r.map(c => fixMojibake(String(c || "")))) };
  }
  return { kind:"text", texts:[fixMojibake(await file.text())] };
}

/* Пробуем все варианты текста и все режимы склейки, берём лучший результат */
function bestParse(texts){
  let best = null;
  (texts || []).forEach(t => {
    if (!t) return;
    [t, t.replace(/\n/g, " ")].forEach(variant => {
      const rows = parseDatedList(variant);
      if (rows && (!best || rows.length > best.length)) best = rows;
    });
  });
  return best;
}

/* Разбор 1: плоский список, где у каждой пары своя дата */
function parseDatedList(text){
  text = String(text || "")
    .replace(/[\u2010-\u2015\u2212]/g, "-")      /* всевозможные тире -> обычный дефис */
    .replace(/[\u00A0\u2007\u202F\u2009\u200A]/g, " "); /* неразрывные пробелы -> обычный */
  const re = /(\d{1,2})\s*[-.\s]?\s*(янв|фев|мар|апр|мая|май|июн|июл|авг|сен|окт|ноя|дек)[а-яё]*\s*[-.\s]?\s*(\d{4}|\d{2})(?!\d)/gi;
  const marks = [];
  let m;
  while ((m = re.exec(text))){
    let y = +m[3]; if (y < 100) y += 2000;
    marks.push({ i:m.index, len:m[0].length, d:+m[1], mo:MONTH3[m[2].toLowerCase().slice(0,3)], y:y });
  }
  if (marks.length < 3) return null;

  const rows = [];
  marks.forEach((mk, k) => {
    const end = k + 1 < marks.length ? marks[k+1].i : text.length;
    const lines = text.slice(mk.i + mk.len, end).replace(/[ \t]+/g, " ").split(/\r?\n/);
    /* Режим 1 — данные пары лежат на одной строке (обычный PDF/Word).
       Режим 2 — извлекатель разложил ячейки по разным строкам: склеиваем всё. */
    const timeRe = /\d{1,2}\s*:\s*\d{2}\s*[-–—]\s*\d{1,2}\s*:\s*\d{2}/;
    let mainIdx = lines.findIndex(l => timeRe.test(l));
    let chunk, rest;
    if (mainIdx >= 0 && /[А-Яа-яЁё]{4}/.test(lines[mainIdx])){
      chunk = lines[mainIdx].trim();
      rest = lines.slice(mainIdx + 1);
    } else {
      chunk = lines.join(" ").replace(/\s+/g, " ").trim();
      rest = [];
    }
    chunk = chunk.replace(/(\d{1,2})\s*:\s*(\d{2})/g, "$1:$2");
    const t = chunk.match(/(\d{1,2}:\d{2})\s*[-–—]\s*(\d{1,2}:\d{2})/);
    if (!t) return;

    let after = chunk.slice(chunk.indexOf(t[0]) + t[0].length);
    const kindM = after.match(LESSON_KINDS);
    let subject, tail;
    if (kindM){
      subject = after.slice(0, after.indexOf(kindM[0]));
      tail = after.slice(after.indexOf(kindM[0]) + kindM[0].length);
    } else { subject = after; tail = ""; }

    tail = tail.replace(GROUP_CODE, " ").replace(POSITIONS, " ");
    let teacher = "";
    const tm = tail.match(/([А-ЯЁ][а-яё]+)\s+([А-ЯЁ]\.\s?[А-ЯЁ]?\.?)/);
    if (tm){
      teacher = tm[1] + " " + tm[2].replace(/\s+/g, "");
      tail = tail.slice(tail.indexOf(tm[0]) + tm[0].length);
    }
    let room = "";
    const rm = tail.trim().match(/^(\S+)/);
    if (rm){
      room = rm[1];
      tail = tail.trim().slice(rm[1].length);
      if (!/^[\dА-ЯЁа-яёA-Za-z][\dА-ЯЁа-яёA-Za-z.\-\/]{0,11}$/.test(room) || /^[-—–]$/.test(room)) room = "";
    }
    /* хвост строки, а если пусто — следующая строка, но только если она похожа
       на продолжение названия: короткая и с маленькой буквы (не подпись документа) */
    let cont = tail.replace(GROUP_CODE, " ").replace(/\s+/g, " ").trim();
    if (!cont){
      for (let li = 0; li < rest.length; li++){
        const cand = rest[li].trim();
        if (!cand) continue;
        if (cand.length <= 45 && /^[а-яё(«"]/.test(cand)) cont = cand;
        break;
      }
    }
    if (cont && cont.length < 70 && !/\d{1,2}:\d{2}/.test(cont)) subject += " " + cont;

    subject = subject.replace(GROUP_CODE, " ").replace(/["«»„“”]/g, " ")
      .replace(/^\s*(ПН|ВТ|СР|ЧТ|ПТ|СБ|ВС)\s+/i, " ")
      .replace(/\s+/g, " ").trim().replace(/[,;:]+$/, "").trim();
    if (!subject || subject.length < 3) return;
    const dt = new Date(mk.y, mk.mo, mk.d);
    rows.push({
      date: iso(dt), day: (dt.getDay() + 6) % 7,
      time: pad(+t[1].split(":")[0]) + ":" + t[1].split(":")[1],
      end: pad(+t[2].split(":")[0]) + ":" + t[2].split(":")[1],
      subject: subject, teacher: teacher, room: room,
      kind: kindM ? kindM[0].toUpperCase() : ""
    });
  });
  return rows.length >= 3 ? rows : null;
}

/* Разбор 2: таблица с заголовками колонок */
function parseTableRows(rows){
  const want = {
    subject:/предмет|дисциплин|занятие/i, teacher:/преподав|фио|педагог/i,
    room:/аудит|кабинет|ауд\b|место/i, time:/время|начало|часы/i,
    day:/день|дата|число/i, kind:/вид\s*занят|тип\s*занят|форма/i
  };
  let head = -1, map = {};
  for (let i = 0; i < Math.min(rows.length, 30); i++){
    const cells = (rows[i] || []).map(c => String(c || ""));
    const found = {};
    Object.keys(want).forEach(k => {
      const idx = cells.findIndex(c => want[k].test(c));
      if (idx >= 0) found[k] = idx;
    });
    if (found.subject !== undefined && (found.time !== undefined || found.day !== undefined)){ head = i; map = found; break; }
  }
  if (head < 0) return null;

  const out = [];
  for (let i = head + 1; i < rows.length; i++){
    const cells = (rows[i] || []).map(c => String(c || "").trim());
    const subject = (cells[map.subject] || "").replace(/\s+/g, " ").trim();
    if (!subject || subject.length > 90) continue;
    const timeCell = map.time !== undefined ? cells[map.time] : "";
    const tm = String(timeCell).match(/(\d{1,2}[:.]\d{2})\s*[-–—]?\s*(\d{1,2}[:.]\d{2})?/);
    if (!tm && map.time !== undefined) continue;
    const dayCell = map.day !== undefined ? cells[map.day] : "";
    let date = "", day = null;
    const dm = String(dayCell).match(/(\d{1,2})[-.\s](янв|фев|мар|апр|мая|май|июн|июл|авг|сен|окт|ноя|дек)[а-яё]*[-.\s](\d{4}|\d{2})/i);
    if (dm){
      let y = +dm[3]; if (y < 100) y += 2000;
      const dt = new Date(y, MONTH3[dm[2].toLowerCase().slice(0,3)], +dm[1]);
      date = iso(dt); day = (dt.getDay() + 6) % 7;
    } else {
      const low = norm(dayCell);
      DAY_KEYS.forEach((keys, idx) => { if (keys.some(k => low.indexOf(k) >= 0)) day = idx; });
      if (day === null && /^[0-6]$/.test(low)) day = +low;
    }
    if (day === null) continue;
    out.push({
      date: date, day: day,
      time: tm ? pad(+tm[1].split(/[:.]/)[0]) + ":" + tm[1].split(/[:.]/)[1] : "09:00",
      end: tm && tm[2] ? pad(+tm[2].split(/[:.]/)[0]) + ":" + tm[2].split(/[:.]/)[1] : "",
      subject: subject,
      teacher: (map.teacher !== undefined ? cells[map.teacher] : "").replace(POSITIONS, "").replace(/\s+/g, " ").trim(),
      room: (map.room !== undefined ? cells[map.room] : "").replace(/^[-—–]$/, "").trim(),
      kind: map.kind !== undefined ? String(cells[map.kind] || "").toUpperCase() : ""
    });
  }
  return out.length >= 3 ? out : null;
}

/* Сводим строки к предметам и парам */
function buildImport(rows){
  const byName = new Map();
  rows.forEach(r => {
    const key = norm(r.subject);
    if (!byName.has(key)) byName.set(key, { name:r.subject, teachers:{}, rooms:{}, rows:[] });
    const s = byName.get(key);
    if (r.subject.length > s.name.length) s.name = r.subject;
    if (r.teacher) s.teachers[r.teacher] = (s.teachers[r.teacher] || 0) + 1;
    if (r.room) s.rooms[r.room] = (s.rooms[r.room] || 0) + 1;
    s.rows.push(r);
  });
  /* обрезанное на переносе название («Практикум Деловая») склеиваем
     с полным, если одно начинается с другого */
  const keys = Array.from(byName.keys()).sort((a,b) => b.length - a.length);
  keys.forEach(short => {
    if (!byName.has(short)) return;
    const long = keys.find(k => k !== short && byName.has(k) && k.length > short.length && k.indexOf(short) === 0);
    if (!long) return;
    const from = byName.get(short), to = byName.get(long);
    from.rows.forEach(r => { r.subject = to.name; to.rows.push(r); });
    Object.keys(from.teachers).forEach(t => { to.teachers[t] = (to.teachers[t] || 0) + from.teachers[t]; });
    Object.keys(from.rooms).forEach(t => { to.rooms[t] = (to.rooms[t] || 0) + from.rooms[t]; });
    byName.delete(short);
  });

  const top = o => Object.keys(o).sort((a,b) => o[b] - o[a])[0] || "";
  const subjects = [];
  let i = 0;
  byName.forEach(s => {
    subjects.push({
      name: s.name, teacher: top(s.teachers), room: top(s.rooms),
      count: s.rows.length, rows: s.rows,
      color: PALETTE[i++ % PALETTE.length]
    });
  });
  subjects.sort((a,b) => b.count - a.count);
  const dates = rows.filter(r => r.date).map(r => r.date).sort();
  return { subjects:subjects, total:rows.length, from:dates[0] || "", to:dates[dates.length-1] || "" };
}

let importData = null;
function humanDate(isoStr){
  if (!isoStr) return "";
  const p = isoStr.split("-");
  return (+p[2]) + " " + MONTHS[+p[1] - 1];
}
function openImport(){
  document.getElementById("fileInput").value = "";
  document.getElementById("fileInput").click();
}
async function handleFile(file){
  showSheet('<h3>Читаю файл</h3><p class="sub">' + esc(file.name) + '</p>' +
    '<div class="loading">Разбираю расписание…</div>', "import");
  try {
    const data = await extractFile(file);
    let rows = null, raw = "";
    if (data.kind === "rows"){
      raw = data.rows.slice(0, 60).map(r => r.join(" | ")).join("\n");
      rows = parseTableRows(data.rows);
      if (!rows) rows = bestParse([data.rows.map(r => r.join(" ")).join("\n")]);
    } else {
      const cand = (data.texts || []).filter(Boolean);
      raw = cand.slice(1).reduce((a, b) =>
        (b.match(/\d{1,2}\s*:\s*\d{2}/g) || []).length > (a.match(/\d{1,2}\s*:\s*\d{2}/g) || []).length ? b : a,
        cand[0] || "");
      rows = bestParse(data.texts);
    }
    if (!rows || !rows.length) return importFailed(raw);
    importData = buildImport(rows);
    renderImport();
  } catch(e){
    showSheet('<h3>Не получилось</h3><p class="sub">' + esc(e && e.message ? e.message : "ошибка чтения файла") +
      '. Для разбора файлов нужен интернет — библиотека подгружается при первом импорте.</p>' +
      '<button class="primary" id="impRetry">Попробовать снова</button>' +
      '<button class="ghost" id="impPaste">Вставить текст расписания</button>' +
      '<button class="ghost" id="impCancel">Закрыть</button>', "import");
    document.getElementById("impRetry").onclick = openImport;
    document.getElementById("impPaste").onclick = openPasteImport;
    document.getElementById("impCancel").onclick = closeSheet;
  }
}
function importFailed(raw){
  const txt = (raw || "").replace(/\n{2,}/g, "\n");
  /* показываем не шапку документа, а кусок оттуда, где должны лежать пары */
  const timeAt = txt.search(/\d{1,2}\s*:\s*\d{2}/);
  const dates = (txt.match(/\d{1,2}\s*[-.\s]?\s*(янв|фев|мар|апр|мая|май|июн|июл|авг|сен|окт|ноя|дек)/gi) || []).length;
  const times = (txt.match(/\d{1,2}\s*:\s*\d{2}/g) || []).length;
  const from = timeAt > 0 ? Math.max(0, timeAt - 90) : 0;
  const preview = txt.slice(from, from + 1100).trim();
  const stats = "Прочитано символов: " + txt.length +
    " · дат найдено: " + dates + " · времени найдено: " + times;
  showSheet('<h3>Не разобрал</h3>' +
    '<p class="sub">' + (txt.trim()
      ? (timeAt > 0
          ? 'Текст прочитан и время занятий в нём есть, но собрать строки в пары не вышло. Ниже — фрагмент как раз с этого места.'
          : 'Текст прочитан, но ни одного времени вида «10:40» в нём нет. Похоже, таблица не попала в текстовый слой.')
      : 'Из файла не удалось вычитать ни строчки. Скорее всего это скан или картинка.') + '</p>' +
    (txt.trim() ? '<p class="hint" style="margin:-4px 0 10px">' + esc(stats) + '</p>' : "") +
    (preview ? '<div class="asr-box" style="max-height:220px;overflow:auto;white-space:pre-wrap;font-size:12.5px">' + esc(preview) + '</div>' : "") +
    '<button class="primary" id="impPaste">Вставить текст вручную</button>' +
    '<button class="ghost" id="impRetry">Выбрать другой файл</button>' +
    (preview ? '<button class="ghost" id="impCopy">Скопировать прочитанное</button>' : "") +
    '<button class="ghost" id="impCancel">Закрыть</button>', "import");
  const cp = document.getElementById("impCopy");
  if (cp) cp.onclick = () => {
    try { navigator.clipboard.writeText(stats + "\n\n" + preview); cp.textContent = "Скопировано"; }
    catch(e){ cp.textContent = "Не вышло скопировать"; }
  };
  document.getElementById("impPaste").onclick = openPasteImport;
  document.getElementById("impRetry").onclick = openImport;
  document.getElementById("impCancel").onclick = closeSheet;
}
function openPasteImport(){
  showSheet('<h3>Вставьте расписание</h3>' +
    '<p class="sub">Откройте файл, выделите таблицу, скопируйте и вставьте сюда. Формат строки: дата, день, время, предмет, преподаватель, аудитория.</p>' +
    '<textarea id="pasteBox" style="min-height:170px" placeholder="02-сен-2026 СР 10:40 - 12:10 Физическая культура ЛЕКЦИЯ Чибисов В.Г. 108"></textarea>' +
    '<button class="primary" id="pasteGo" disabled>Разобрать</button>' +
    '<button class="ghost" id="impCancel">Отмена</button>', "import");
  const box = document.getElementById("pasteBox");
  const go = document.getElementById("pasteGo");
  box.addEventListener("input", () => { go.disabled = box.value.trim().length < 20; });

function renderImport(){

      ", " + d.total + " " + plural(d.total,"пара","пары","пар") + ", " + period + '.</p>' +
    d.subjects.map((s,i) =>
      '<div class="imp-row"><span class="dot" style="background:' + s.color + '"></span>' +
      '<span class="txt"><b>' + esc(s.name) + '</b><span>' +
        esc([s.teacher, s.room ? "ауд. " + s.room : ""].filter(Boolean).join(", ") || "без преподавателя") +
      '</span></span><span class="cnt">' + s.count + '</span>' +
      '<button class="del" data-imp-del="' + i + '" aria-label="Убрать">' + ICON.trash + '</button></div>').join("") +
    '<button class="primary" id="impAdd">Добавить в расписание</button>' +
    '<button class="ghost" id="impReplace">Заменить всё расписание</button>', "import");

  document.getElementById("impAdd").onclick = () => applyImport(false);
  document.getElementById("impReplace").onclick = () => applyImport(true);
  sheet.scrollTop = 0;
}
function applyImport(replace){
  const d = importData;
  if (replace){ state.subjects = []; state.lessons = []; }
  d.subjects.forEach(s => {
    let subj = state.subjects.find(x => norm(x.name) === norm(s.name));
    if (!subj){
      subj = { id:uid(), name:s.name, teacher:s.teacher, room:s.room, color:s.color, notes:[] };
      state.subjects.push(subj);
    } else {
      if (!subj.teacher && s.teacher) subj.teacher = s.teacher;
      if (!subj.room && s.room) subj.room = s.room;
    }
    s.rows.forEach(r => {
      const dup = state.lessons.some(l => l.subjectId === subj.id && l.time === r.time &&
        (r.date ? l.date === r.date : l.day === r.day && !l.date));
      if (dup) return;
      state.lessons.push({
        id:uid(), subjectId:subj.id, day:r.day, date:r.date || "",
        time:r.time, end:r.end || "", room:r.room || "", kind:r.kind || "", notes:[]
      });
    });
  });
  state.onboarded = true;
  save(); buzz("medium");
  importData = null;
  intro.hidden = true; app.hidden = false;
  weekOffset = 0; selectedDay = todayIdx();
  renderAll(); closeSheet();
}
document.getElementById("fileInput").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (f) handleFile(f);
});

/* ---------------- события ---------------- */
document.getElementById("recBtn").onclick = () => {
  if (recording && sheetOpen === "assistant"){ stopRec(false); return; }
  buzz("medium"); openAssistant();
};
document.getElementById("dayNotesBtn").onclick = () => { buzz("light"); openDayNotes(); };
document.getElementById("addSubjectBtn").onclick = () => openSubjectForm(null);
document.getElementById("addLessonBtn").onclick = openLessonForm;
document.getElementById("importBtn").onclick = () => { buzz("light"); openImport(); };
document.getElementById("weekNav").addEventListener("click", e => {
  const b = e.target.closest("[data-week]");
  if (!b) return;
  weekOffset += +b.dataset.week;
  buzz("light"); renderWeek(); renderTimeline();
});
document.getElementById("bellBtn").onclick = () => { buzz("light"); openNotifySheet(); };
document.getElementById("resetBtn").onclick = () => {
  showSheet('<h3>Сбросить всё?</h3><p class="sub">Предметы, расписание и заметки удалятся. Отменить будет нельзя.</p>' +
    '<button class="primary" id="doReset" style="background:linear-gradient(135deg,#FF3B5C,#FF6B4A)">Удалить и настроить заново</button>' +
    '<button class="ghost" id="cancelReset">Отмена</button>', "reset");
  document.getElementById("doReset").onclick = () => {
    state = emptyState(); save(); closeSheet(); showIntro();
  };
  document.getElementById("cancelReset").onclick = closeSheet;
};

document.getElementById("subjectList").addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t){ const id = t.dataset.toggle; openSubjects.has(id) ? openSubjects.delete(id) : openSubjects.add(id); buzz("light"); renderSubjects(); return; }
  const ed = e.target.closest("[data-edit-subject]");
  if (ed) openSubjectForm(ed.dataset.editSubject);
});
document.getElementById("week").addEventListener("click", e => {
  const b = e.target.closest("[data-day]"); if (!b) return;
  selectedDay = +b.dataset.day; buzz("light"); renderWeek(); renderTimeline();
});
document.getElementById("timeline").addEventListener("click", e => {
  const t = e.target.closest("[data-lesson-toggle]");
  if (t){ const id = t.dataset.lessonToggle; openLessons.has(id) ? openLessons.delete(id) : openLessons.add(id); buzz("light"); renderTimeline(); return; }
  const d = e.target.closest("[data-del-lesson]");
  if (d){ state.lessons = state.lessons.filter(l => l.id !== d.dataset.delLesson); save(); renderAll(); }
});
document.addEventListener("click", e => {
  const send = e.target.closest("[data-send]");
  if (send){
    const ta = document.querySelector('[data-input="' + send.dataset.send + '"][data-owner="' + send.dataset.owner + '"]');
    const key = draftKey(send.dataset.send, send.dataset.owner);
    const text = (ta ? ta.value : "") || drafts[key] || "";
    if (text.trim()){ delete drafts[key]; addNote(send.dataset.send, send.dataset.owner, text); if (ta) ta.value = ""; }
    return;
  }
  const voice = e.target.closest("[data-voice]");
  if (voice){ buzz("medium"); openVoice({ scope:voice.dataset.voice, owner:voice.dataset.owner }); return; }
  const del = e.target.closest("[data-del]");
  if (del){
    const scope = del.dataset.del, owner = del.dataset.owner, nid = del.dataset.note;
    if (scope === "subject"){ const s = subjById(owner); if (s) s.notes = s.notes.filter(n => n.id !== nid); }
    else if (scope === "lesson"){ const l = state.lessons.find(x => x.id === owner); if (l) l.notes = l.notes.filter(n => n.id !== nid); }
    else state.dayNotes = state.dayNotes.filter(n => n.id !== nid);
    save(); renderAll();
    if (sheetOpen === "day") openDayNotes();
    return;
  }
  const tick = e.target.closest("[data-tick]");
  if (tick){
    const n = state.dayNotes.find(x => x.id === tick.dataset.tick);
    if (n){ n.done = !n.done; save(); buzz("light"); renderDayPill(); openDayNotes(); }
    return;
  }
  const add = e.target.closest("[data-add]");
  if (add){ buzz("light"); openQuadForm(+add.dataset.add, null); return; }
  const on = e.target.closest("[data-open-note]");
  if (on){
    if (document.body.classList.contains("dragging")) return;
    const inq = on.dataset.inQuad;
    buzz("light");
    openNoteView(on.dataset.openNote, inq !== undefined ? () => openQuadFull(+inq) : null);
    return;
  }
  const fl = e.target.closest("[data-full]");
  if (fl){
    if (document.body.classList.contains("dragging")) return;
    buzz("light"); openQuadFull(+fl.dataset.full); return;
  }
  const mv = e.target.closest("[data-move]");
  if (mv){ buzz("light"); openQuadPick(mv.dataset.move); return; }
  const srt = e.target.closest("[data-sort]");
  if (srt){ buzz("light"); openQuadPick(srt.dataset.sort); return; }
});
document.addEventListener("input", e => {
  if (e.target.matches("textarea[data-input]")){
    /* держим набранное отдельно от разметки: перерисовка списка больше
       не стирает недописанную заметку */
    drafts[draftKey(e.target.dataset.input, e.target.dataset.owner)] = e.target.value;
    e.target.style.height = "auto";
    e.target.style.height = Math.min(e.target.scrollHeight, 130) + "px";
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && e.target.matches("textarea[data-input]")){
    e.preventDefault();
    delete drafts[draftKey(e.target.dataset.input, e.target.dataset.owner)];
    addNote(e.target.dataset.input, e.target.dataset.owner, e.target.value);
    e.target.value = ""; e.target.style.height = "auto";
  }
  if (e.key === "Escape" && sheetOpen) closeSheet();
});

function applyTheme(night){
  document.documentElement.classList.toggle("night", !!night);
  try { tg && tg.setHeaderColor && tg.setHeaderColor("#3D1FA8"); } catch(e){}
  try { tg && tg.setBackgroundColor && tg.setBackgroundColor(night ? "#0B0912" : "#F4F2FA"); } catch(e){}
}
document.getElementById("themeBtn").onclick = () => {
  state.night = !document.documentElement.classList.contains("night");
  applyTheme(state.night); save(); buzz("light");
};

/* ---------------- старт ---------------- */
load(saved => {
  state = saved && saved.subjects ? saved : emptyState();
  if (!("onboarded" in state)) state.onboarded = true;
  const night = state.night === null || state.night === undefined
    ? (tg ? tg.colorScheme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches)
    : state.night;
  applyTheme(night);
  if (!state.onboarded) showIntro();
  else { intro.hidden = true; app.hidden = false; renderAll(); }
  renderNotify();
  if (state.onboarded) pushServer(false);
  setInterval(() => {
    if (syncPending) pushCloud();
    if (app.hidden) return;
    /* пока поле в фокусе — не перерисовываем, иначе набираемый текст
       и клавиатура слетают прямо под руками */
    const el = document.activeElement;
    if (el && el.matches && el.matches("textarea, input, [contenteditable]")) return;
    renderHero();
    if (selectedDay === todayIdx()) renderTimeline();
  }, 30000);
});
</script>
