<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Универ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2FA;--surface:#FFFFFF;--surface-2:#F7F6FC;
  --text:#15121F;--text-2:#645C7E;--text-3:#9A93B0;
  --line:rgba(21,18,31,.08);--line-2:rgba(21,18,31,.05);
  --violet:#5B3DF5;--pink:#E0349B;--coral:#FF6B4A;
  --sheet:#FFFFFF;--shade:rgba(14,10,28,.5);
  --fab-shadow:0 10px 30px rgba(91,61,245,.4);
  --hero-shadow:0 18px 40px -18px rgba(91,61,245,.55);
}
html.night{
  --bg:#0B0912;--surface:#15121F;--surface-2:#1B1729;
  --text:#F2F0F8;--text-2:#A79FC0;--text-3:#6E6688;
  --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.05);
  --sheet:#15121F;--shade:rgba(0,0,0,.66);
  --fab-shadow:0 10px 30px rgba(91,61,245,.5);
  --hero-shadow:0 18px 44px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-x:none}
#sheetBody{touch-action:pan-y}
body{
  font-family:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.42;
  padding-bottom:calc(118px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:"Unbounded","Golos Text",sans-serif;letter-spacing:-.03em}
[hidden]{display:none!important}

/* ---------------- хиро ---------------- */
.hero{position:relative;overflow:hidden;background:#3D1FA8;border-radius:0 0 30px 30px;
  padding:calc(18px + env(safe-area-inset-top)) 20px 30px;color:#fff;box-shadow:var(--hero-shadow)}
.blob{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none}
.b1{width:280px;height:280px;background:var(--violet);top:-110px;left:-60px}
.b2{width:250px;height:250px;background:var(--pink);top:-40px;right:-90px;opacity:.85}
.b3{width:230px;height:230px;background:var(--coral);bottom:-140px;left:30%;opacity:.7}
.hero-in{position:relative;z-index:2}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.date{font-size:13.5px;font-weight:500;color:rgba(255,255,255,.78)}
.theme-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff;position:relative}
.hero-tools{position:relative;display:flex;gap:8px}
.hero-tools .mini-btn{position:absolute;top:44px;right:4px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:rgba(255,255,255,.12);color:rgba(255,255,255,.8)}
.hero-tools .mini-btn:active,.theme-btn:active{transform:scale(.94)}
.theme-btn.off{color:rgba(255,255,255,.6)}
.theme-btn .bdot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#7CFFB2;box-shadow:0 0 0 2px #4A26C2}
.theme-btn .bdot.err{background:#FF6B4A}
.status{display:inline-flex;align-items:center;gap:7px;margin:0 0 10px;font-size:12.5px;font-weight:600;
  color:rgba(255,255,255,.88);background:rgba(255,255,255,.15);padding:5px 11px;border-radius:999px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#7CFFB2;box-shadow:0 0 0 0 rgba(124,255,178,.7);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 8px rgba(124,255,178,0)}100%{box-shadow:0 0 0 0 rgba(124,255,178,0)}}
.hero h1{margin:0;font-size:31px;font-weight:700;line-height:1.05;overflow-wrap:anywhere}
.hero-meta{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.82);flex-wrap:wrap}
.tag{background:rgba(255,255,255,.18);border-radius:9px;padding:4px 10px;font-weight:600;color:#fff;font-size:12.5px}
.bar{height:5px;border-radius:999px;background:rgba(255,255,255,.24);margin-top:20px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:#fff;width:0;transition:width 1.1s cubic-bezier(.3,.8,.3,1)}
.bar-labels{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:rgba(255,255,255,.72)}
.bar-labels b{font-weight:600;color:#fff}

/* ---------------- общее ---------------- */
.wrap{padding:0 16px}
.day-pill{display:flex;align-items:center;gap:11px;width:100%;background:var(--surface);border-radius:18px;
  padding:15px 16px;margin:-20px 0 22px;position:relative;z-index:5;box-shadow:0 8px 24px -12px rgba(21,18,31,.28)}
html.night .day-pill{box-shadow:0 8px 24px -14px #000;border:1px solid var(--line)}
.day-pill .ic{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--violet),var(--pink));display:grid;place-items:center;color:#fff;flex:none}
.day-pill .label{flex:1;text-align:left;font-weight:600;font-size:15px}
.day-pill .label small{display:block;font-weight:400;font-size:12.5px;color:var(--text-3)}
.badge{min-width:26px;height:26px;padding:0 8px;border-radius:999px;flex:none;background:var(--violet);color:#fff;font-size:12.5px;font-weight:600;display:grid;place-items:center}
.badge.zero{background:var(--surface-2);color:var(--text-3)}
.sec-head{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.sec-head h2{margin:0;font-size:19px;font-weight:600;flex:1}
.add-btn{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--violet);background:var(--surface);border-radius:11px;padding:7px 11px}
html.night .add-btn{background:var(--surface-2)}
.add-btn:active{transform:scale(.97)}
.card{background:var(--surface);border-radius:22px;overflow:hidden;margin-bottom:26px}
html.night .card{border:1px solid var(--line)}

/* ---------------- предметы ---------------- */
.thead{display:grid;grid-template-columns:1fr 1fr 56px 20px;gap:10px;padding:14px 16px 6px;font-size:11.5px;color:var(--text-3)}
.thead div:nth-child(3){text-align:center}
.subject{position:relative}
.subject + .subject .trow::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:var(--line-2)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 56px 20px;grid-template-areas:"n r c" "t r c";column-gap:10px;row-gap:3px;align-items:center;width:100%;text-align:left;padding:13px 16px;position:relative}
.trow .s-name{grid-area:n}.trow .s-teacher{grid-area:t;padding-left:15px}.trow .s-room{grid-area:r}.trow .chev{grid-area:c}
.thead{grid-template-columns:minmax(0,1fr) 56px 20px!important}
.thead div:nth-child(2){display:none}
.w-wide{display:none}
@media (min-width:560px){
  .trow{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 56px 20px;grid-template-areas:"n t r c"}
  .trow .s-teacher{padding-left:0}
  .thead{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 56px 20px!important}
  .thead div:nth-child(2){display:block}
  .w-wide{display:inline}.w-narrow{display:none}
}
.trow:active{background:var(--surface-2)}
.s-name{font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:7px;overflow-wrap:break-word;word-break:normal;hyphens:manual;min-width:0}
.s-name .nm{min-width:0;overflow-wrap:break-word}
.dot{width:8px;height:8px;border-radius:3px;flex:none}
.s-teacher{font-size:12.5px;color:var(--text-2);overflow-wrap:break-word;word-break:normal;min-width:0}
.s-room{font-size:12.5px;font-weight:600;text-align:center;border-radius:8px;padding:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--text-3);transition:transform .2s ease;display:grid;place-items:center}
.subject.open .chev{transform:rotate(90deg)}
.subject.open{background:var(--surface-2)}
.count{font-size:11.5px;font-weight:600;color:var(--text-3)}
.panel{display:none;padding:0 16px 16px}
.subject.open .panel{display:block;animation:drop .22s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ---------------- заметки ---------------- */
.notes{display:flex;flex-direction:column;gap:8px;margin-bottom:11px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:11px 12px;font-size:14px}
html.night .note{background:#100E1A}
.note p{margin:0;flex:1;overflow-wrap:anywhere}
.note time{display:block;font-size:11.5px;color:var(--text-3);margin-top:4px}
.note .del{color:var(--text-3);padding:2px;flex:none}
.empty{font-size:13px;color:var(--text-3);padding:4px 0 12px;margin:0}
.empty-box{padding:6px 16px 20px;text-align:center}
.empty-box p{margin:0 0 14px;font-size:13.5px;color:var(--text-3)}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;resize:none;background:var(--surface-2);border:0;border-radius:14px;padding:11px 13px;font-size:14px;min-height:42px;max-height:130px}
.subject.open .composer textarea,.slot.open .composer textarea{background:var(--surface)}
html.night .composer textarea,html.night .subject.open .composer textarea,html.night .slot.open .composer textarea{background:#100E1A}
.composer textarea::placeholder{color:var(--text-3)}
.icon-btn{width:42px;height:42px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.subject.open .icon-btn,.slot.open .icon-btn{background:var(--surface)}
html.night .icon-btn,html.night .subject.open .icon-btn,html.night .slot.open .icon-btn{background:#100E1A}
.icon-btn.solid,html.night .icon-btn.solid,.subject.open .icon-btn.solid,.slot.open .icon-btn.solid{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}
.icon-btn.rec{background:linear-gradient(140deg,#FF3B5C,#FF6B4A);color:#fff}
.icon-btn:active{transform:scale(.94)}
.ghost-link{font-size:13px;font-weight:500;color:var(--text-3);padding:12px 0 2px;display:block;text-align:left}

/* ---------------- расписание ---------------- */
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 0}
.week-nav .plate{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:9px 14px;border-radius:15px;background:var(--surface-2);line-height:1.15}
html.night .week-nav .plate{background:#141120}
.week-nav .plate b{font-family:"Unbounded",system-ui,sans-serif;font-size:14.5px;font-weight:600;
  letter-spacing:-.01em;color:var(--text-1)}
.week-nav .plate i{font-style:normal;font-size:11.5px;color:var(--text-3);letter-spacing:.01em}
.week-nav .plate.now{background:linear-gradient(135deg,var(--violet),var(--pink));
  box-shadow:0 8px 22px -12px var(--violet)}
.week-nav .plate.now b,.week-nav .plate.now i{color:#fff}
.week-nav .plate.now i{color:rgba(255,255,255,.8)}
.week-nav .wk{width:34px;height:34px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--text-3);background:var(--surface-2)}
html.night .week-nav .wk{background:#100E1A}
.week-nav .wk:active{transform:scale(.92)}
.imp-row{display:flex;align-items:center;gap:11px;background:var(--surface-2);border-radius:15px;padding:12px 14px;margin-bottom:8px}
html.night .imp-row{background:#100E1A}
.imp-row .txt{flex:1;min-width:0}
.imp-row .txt b{display:block;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.imp-row .txt span{display:block;font-size:12.5px;color:var(--text-3);margin-top:2px;overflow-wrap:anywhere}
.imp-row .cnt{font-size:12px;font-weight:600;color:var(--text-3);flex:none}
.loading{text-align:center;padding:30px 0;color:var(--text-3);font-size:14px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:14px 12px 4px}
.day{border-radius:15px;padding:9px 0;text-align:center;position:relative}
.day i{display:block;font-style:normal;font-size:11px;color:var(--text-3);margin-bottom:4px}
.day b{display:block;font-family:"Unbounded",sans-serif;font-size:15px;font-weight:500;letter-spacing:-.03em}
.day u{display:block;width:4px;height:4px;border-radius:50%;background:var(--text-3);margin:5px auto 0;opacity:0;text-decoration:none}
.day.has u{opacity:.6}
.day.today b{color:var(--violet)}
.day.sel{background:linear-gradient(150deg,var(--violet),var(--pink))}
.day.sel i,.day.sel b{color:#fff}
.day.sel u{background:#fff;opacity:.85}
.timeline{padding:6px 16px 18px}
.slot{display:flex;gap:13px;padding:12px 0;position:relative}
.slot + .slot::before{content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--line-2)}
.when{width:45px;flex:none;padding-top:2px}
.when b{display:block;font-family:"Unbounded",sans-serif;font-size:14px;font-weight:500;letter-spacing:-.04em}
.when em{display:block;font-style:normal;font-size:11.5px;color:var(--text-3);margin-top:2px}
.lesson{flex:1;min-width:0;border-left:3px solid;padding-left:13px}
.lesson-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left}
.lesson-head .nm{font-weight:600;font-size:15px;flex:1;overflow-wrap:anywhere}
.lesson-head .rm{font-size:12px;font-weight:600;border-radius:7px;padding:3px 8px;flex:none}
.lesson .meta{font-size:12.5px;color:var(--text-3);margin-top:3px}
.now-tag{font-size:11px;font-weight:600;color:#fff;background:var(--coral);border-radius:6px;padding:2px 7px;margin-right:7px}
.lesson .panel{display:none;padding:12px 0 0}
.slot.open .lesson .panel{display:block;animation:drop .22s ease}

/* ---------------- две равные кнопки действий ---------------- */
.actions{
  position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:40;display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.act{
  display:flex;align-items:center;justify-content:center;gap:9px;
  background:var(--surface);border-radius:19px;padding:14px 8px;
  font-weight:600;font-size:14px;letter-spacing:-.01em;
  box-shadow:0 10px 28px -12px rgba(21,18,31,.4);
  transition:transform .14s ease;
}
html.night .act{border:1px solid var(--line);box-shadow:0 10px 28px -14px #000}
.act:active{transform:scale(.97)}
.act .ic{
  width:30px;height:30px;border-radius:11px;flex:none;display:grid;place-items:center;
  color:#fff;background:linear-gradient(135deg,var(--violet),var(--pink));
}
.act .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.on{background:linear-gradient(135deg,#FF3B5C,#FF6B4A);color:#fff;animation:pulse 1.6s ease-in-out infinite}
.act.on .ic{background:rgba(255,255,255,.22)}
@keyframes pulse{0%,100%{box-shadow:0 10px 28px -12px rgba(255,59,92,.6)}50%{box-shadow:0 10px 34px -6px rgba(255,59,92,.45)}}

.pick{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.pick-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface-2);border-radius:17px;padding:13px 14px;color:var(--text-3)}
html.night .pick-row{background:#141120}
.pick-row:active{transform:scale(.985)}
.pick-row .ic{width:38px;height:38px;flex:none;border-radius:13px;display:grid;place-items:center;color:#fff}
.pick-row .ic.day{background:linear-gradient(135deg,#F5A623,#FF6B4A)}
.pick-row .ic.subj{background:linear-gradient(135deg,var(--violet),var(--pink))}
.pick-row .ic.les{background:linear-gradient(135deg,#2D8CFF,#00B3A4)}
.pick-row .ic.new{background:var(--text-3)}
.pick-row .ic.date,.pick-row .ic.time{background:var(--surface);color:var(--text-1)}
html.night .pick-row .ic.date,html.night .pick-row .ic.time{background:#1C1828}
.pick-row .ic.date b{font-size:15px;font-weight:600}
.pick-row .ic.time b{font-size:11.5px;font-weight:600;letter-spacing:-.02em}
.pick-row .dot{width:11px;height:11px;flex:none;border-radius:50%;margin:0 13px 0 6px}
.pick-row .tx{flex:1;min-width:0}
.pick-row .tx b{display:block;font-size:14.5px;font-weight:600;color:var(--text-1);
  letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-row .tx i{display:block;font-style:normal;font-size:12px;color:var(--text-3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost-link.back{display:flex;width:100%;justify-content:flex-start;align-items:center;gap:5px;margin:0 0 12px;padding:0;
  font-size:13px;color:var(--text-3)}
.ghost-link.back svg{width:15px;height:15px}
/* ---------------- переключатель вида и матрица ---------------- */
@keyframes swl{from{opacity:.3;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes swr{from{opacity:.3;transform:translateX(-28px)}to{opacity:1;transform:none}}
#sheetBody.sw-l{animation:swl .22s ease}#sheetBody.sw-r{animation:swr .22s ease}
.swipe-hint{text-align:center;font-size:11.5px;color:var(--text-3);margin:-8px 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px;margin:0 0 16px}
html.night .seg{background:#100E1A}
.seg button{padding:9px 6px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--text-3);transition:background .16s ease,color .16s ease}
.seg button.on{background:var(--sheet);color:var(--text-1);box-shadow:0 2px 8px -4px rgba(21,18,31,.35)}
html.night .seg button.on{background:#231E33}

.unsorted{background:var(--surface-2);border-radius:16px;padding:12px 13px;margin-bottom:12px}
html.night .unsorted{background:#100E1A}
.unsorted .ulabel{margin:0 0 9px;font-size:12px;color:var(--text-3)}
.uchip{display:inline-block;max-width:100%;background:var(--sheet);border-radius:10px;padding:7px 11px;
  margin:0 6px 6px 0;font-size:13px;font-weight:500;text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
html.night .uchip{background:#231E33}

.matrix{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:6px}
.quad{position:relative;background:var(--surface-2);border-radius:17px;padding:12px 11px 40px;
  border-top:3px solid var(--qc);min-height:132px}
html.night .quad{background:#100E1A}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;margin-bottom:9px}
.qhead b{font-size:12.5px;font-weight:600;letter-spacing:-.01em;color:var(--qc);flex:1 0 auto;line-height:1.2}
.qhead i{display:block;width:100%;font-style:normal;font-size:11px;font-weight:500;color:var(--text-2);margin-top:3px}
.qn{position:absolute;top:11px;right:11px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;
  background:var(--qc);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.qlist{display:flex;flex-direction:column;gap:5px}
.matrix .qlist{max-height:188px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;margin:0 -3px;padding:0 3px}
.matrix .qlist::-webkit-scrollbar{display:none}
.matrix .qlist.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(#000 calc(100% - 26px),transparent)}
.matrix .qlist.top{-webkit-mask-image:linear-gradient(transparent,#000 18px);mask-image:linear-gradient(transparent,#000 18px)}
.matrix .qlist.top.more{-webkit-mask-image:linear-gradient(transparent,#000 18px,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(transparent,#000 18px,#000 calc(100% - 26px),transparent)}
.qnote{position:relative;background:var(--sheet);border-radius:11px;padding:2px}
html.night .qnote{background:#231E33}
.qnote.done{opacity:.5}
.qnote.done .qtitle{text-decoration:line-through}
.qtick{position:absolute;top:8px;left:8px;margin:0;z-index:1;width:16px;height:16px;border-radius:5px;border:1.6px solid var(--line);
  display:grid;place-items:center;color:transparent}
.qtick.on{background:var(--qc);border-color:var(--qc);color:#fff}
.qtick svg{width:10px;height:10px}
.qtitle{display:block;width:100%;text-align:left;padding:6px 7px 6px 28px;font-size:12.5px;line-height:1.3;
  font-weight:500;overflow-wrap:anywhere}
.qtitle .chev{display:inline-block;width:11px;height:11px;margin-left:3px;color:var(--text-3);vertical-align:-1px}
.qtitle .chev svg{width:11px;height:11px}
.qnote.open .chev{transform:rotate(90deg)}
.qbody{padding:0 8px 9px 28px;font-size:12px;line-height:1.45;color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
.qacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qacts button{white-space:nowrap;font-size:11px;font-weight:600;color:var(--violet);
  background:var(--surface-2);border-radius:8px;padding:5px 8px}
html.night .qacts button{background:#100E1A}
.qacts button[data-del]{color:var(--text-3)}
.qempty{margin:0;font-size:12px;color:var(--text-3)}
.qadd{position:absolute;left:11px;bottom:10px;width:26px;height:26px;border-radius:9px;
  background:var(--sheet);color:var(--qc);display:grid;place-items:center}
html.night .qadd{background:#231E33}
.qadd svg{width:15px;height:15px}
.qadd:active{transform:scale(.9)}
.nbody{display:block;font-size:12.5px;color:var(--text-3);margin-top:3px;white-space:pre-wrap}
textarea.field{resize:none;font-family:inherit;line-height:1.45}
.mx-demo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}
.mx-demo div{background:var(--surface-2);border-top:3px solid var(--qc);border-radius:12px;padding:9px 10px}
html.night .mx-demo div{background:#100E1A}
.mx-demo b{display:block;font-size:11.5px;font-weight:600;color:var(--qc)}
.mx-demo i{display:block;font-style:normal;font-size:10px;color:var(--text-3);margin-top:2px}
.quad.drop{background:color-mix(in srgb,var(--qc) 16%,var(--surface-2));outline:2px dashed var(--qc);outline-offset:-2px}
html.night .quad.drop{background:color-mix(in srgb,var(--qc) 22%,#100E1A)}
.qnote.lift{opacity:.35}
.qnote.ghost{box-shadow:0 16px 34px -10px rgba(21,18,31,.45);transform:scale(1.04);opacity:.96}
html.night .qnote.ghost{box-shadow:0 16px 34px -12px #000}
body.dragging{user-select:none;-webkit-user-select:none}
body.dragging .sheet{overflow:hidden}
.donetgl{display:flex;align-items:center;gap:7px;width:100%;justify-content:center;
  background:var(--surface-2);border-radius:12px;padding:9px 12px;margin:-6px 0 14px;
  font-size:12.5px;font-weight:600;color:var(--text-3)}
html.night .donetgl{background:#100E1A}
.donetgl.on{color:var(--violet)}
.donetgl span{background:var(--sheet);border-radius:999px;padding:1px 7px;font-size:11px}
html.night .donetgl span{background:#231E33}
.mhint{margin:10px 2px 2px;font-size:11.5px;color:var(--text-3);text-align:center}
.sheet.full{max-height:96vh;height:96vh}
.sheet.full #sheetBody{display:flex;flex-direction:column;min-height:calc(96vh - 46px)}
.sheet.full #sheetBody .fulllist{flex:1;align-content:flex-start}
.sheet.full #sheetBody .primary{margin-top:auto}
.sheet.full #sheetBody .sub{flex:none}
.qhead{width:100%;text-align:left;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;margin-bottom:9px}
.qhead:active{opacity:.6}
.qhead .exp{display:inline-block;width:12px;height:12px;margin-left:5px;color:var(--text-3);vertical-align:-1px}
.qtag{display:table;background:color-mix(in srgb,var(--qc) 15%,transparent);color:var(--qc);
  border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:600;margin-bottom:9px}
.qtag.none{background:var(--surface-2);color:var(--text-3)}
h3.nvt{margin:0 0 10px;font-size:21px;line-height:1.25}
h3.nvt.done{text-decoration:line-through;color:var(--text-3)}
.nvbody{background:var(--surface-2);border-radius:14px;padding:13px 14px;font-size:14px;line-height:1.5;
  color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
html.night .nvbody{background:#100E1A}
.nvtime{margin:10px 2px 16px;font-size:12px;color:var(--text-3)}
.nvrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.nvrow .ghost{margin:0}
.ghost-link.danger{color:#FF3B5C;margin-top:14px}
.fulllist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.fnote{display:flex;align-items:flex-start;gap:10px;background:var(--surface-2);border-radius:15px;padding:12px 13px}
html.night .fnote{background:#100E1A}
.fnote.done{opacity:.5}
.fnote.done .ftx b{text-decoration:line-through}
.fnote .qtick{position:static;margin:2px 0 0;width:19px;height:19px;flex:none}
.fnote .qtick svg{width:12px;height:12px}
.ftx{flex:1;min-width:0;text-align:left}
.ftx b{display:block;font-size:14.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.ftx span{display:block;font-size:12.5px;color:var(--text-3);margin-top:3px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.uchip.ghost{box-shadow:0 14px 30px -10px rgba(21,18,31,.45);transform:scale(1.05)}
.uchip.lift{opacity:.35}
.nvcard{background:var(--surface-2);border-radius:20px;padding:15px 16px 13px;margin-bottom:14px;
  border-top:3px solid var(--qc, var(--line))}
html.night .nvcard{background:#100E1A}
.nvtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.nvtop .qtag{margin:0}
.nvtick{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--qc, var(--text-3));
  display:grid;place-items:center;color:transparent;transition:background .15s ease}
.nvtick.on{background:var(--qc, var(--violet));border-color:var(--qc, var(--violet));color:#fff}
.nvtick svg{width:14px;height:14px}
.nvtick:active{transform:scale(.9)}
.nvcard h3.nvt{margin:0 0 10px;font-size:20px;line-height:1.28;overflow-wrap:anywhere}
.nvcard.done h3.nvt{text-decoration:line-through;color:var(--text-3)}
.nvcard .nvbody{background:none;padding:0;border-radius:0;font-size:14.5px;line-height:1.55;color:var(--text-2)}
.nvcard.done .nvbody{color:var(--text-3)}
.nvempty{margin:0;font-size:13px;color:var(--text-3)}
.nvcard .nvtime{margin:12px 0 0}
.sheet .nvcard textarea{display:block;width:100%;border:0;outline:0;background:transparent;resize:none;
  padding:0;margin:0;font-family:inherit;color:inherit;overflow:hidden;min-height:0;border-radius:0;font-size:inherit}
.sheet .nvcard textarea.nvt{font-family:"Unbounded",system-ui,sans-serif;font-size:20px;font-weight:600;
  line-height:1.28;letter-spacing:-.01em;color:var(--text-1);margin-bottom:10px}
.sheet .nvcard textarea.nvbody{font-size:14.5px;line-height:1.55;color:var(--text-2);min-height:44px;border-radius:0}
.sheet .nvcard textarea::placeholder{color:var(--text-3)}
.sheet .nvcard textarea:focus{background:color-mix(in srgb,var(--qc, var(--violet)) 7%,transparent);
  border-radius:8px;box-shadow:0 0 0 6px color-mix(in srgb,var(--qc, var(--violet)) 7%,transparent)}
.sheet .nvcard.done textarea.nvt{text-decoration:line-through;color:var(--text-3)}
.sheet .nvcard.done textarea.nvbody{color:var(--text-3)}
.notify{background:var(--surface-2);border-radius:18px;padding:15px 16px 13px;margin:4px 0 12px}
html.night .notify{border:1px solid var(--line)}
.nrow{display:flex;align-items:center;gap:12px}
.nic{width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,#F5A623,#FF6B4A)}
.ntx{flex:1;min-width:0}
.ntx b{display:block;font-size:15px;font-weight:600}
.ntx i{display:block;font-style:normal;font-size:12px;color:var(--text-3);margin-top:1px}
.switch{width:48px;height:29px;flex:none;border-radius:999px;background:var(--line);position:relative;transition:background .18s ease}
.switch span{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .18s ease}
.switch.on{background:linear-gradient(135deg,var(--violet),var(--pink))}
.switch.on span{transform:translateX(19px)}
.nstat{margin:10px 0 0;font-size:12.5px;line-height:1.45;color:var(--text-3)}
.nstat.err{color:#E0344B}
.nstat.ok{color:#00A392;font-weight:600}
.ntest{margin-top:10px;font-size:13px;font-weight:600;color:var(--violet);padding:0}
.ntest:disabled{color:var(--text-3)}
/* плашки матрицы не выделяются долгим нажатием */
.matrix, .quad, .qnote, .qtitle, .uchip, .unsorted{
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.dragging, body.dragging *{-webkit-user-select:none!important;user-select:none!important;cursor:grabbing}
/* ---------------- лист ---------------- */
.shade{position:fixed;inset:0;background:var(--shade);z-index:110;opacity:0;pointer-events:none;transition:opacity .22s ease}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:120;background:var(--sheet);border-radius:28px 28px 0 0;
  padding:10px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(103%);
  transition:transform .3s cubic-bezier(.22,.72,.28,1);max-height:88vh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h3{margin:0 0 5px;font-size:21px;font-weight:600}
.sheet .sub{font-size:13px;color:var(--text-3);margin:0 0 16px}
.sheet .note{background:var(--surface-2)}
html.night .sheet .note{background:#100E1A}
.sheet textarea{width:100%;background:var(--surface-2);border:0;border-radius:16px;padding:14px;font-size:15px;min-height:100px;resize:none}
html.night .sheet textarea{background:#100E1A}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 2px}
.chip{border-radius:999px;padding:8px 13px;font-size:13px;font-weight:500;background:var(--surface-2);color:var(--text-2)}
html.night .chip{background:#100E1A}
.chip.on{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}
.chip-label{font-size:12px;color:var(--text-3);margin:18px 0 0}
.primary{width:100%;border-radius:17px;padding:16px;font-weight:600;font-size:15px;margin-top:18px;
  background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}
.primary:disabled{opacity:.35}
.ghost{width:100%;padding:13px;color:var(--text-3);font-weight:500;font-size:14px;margin-top:4px}
.field{width:100%;background:var(--surface-2);border:0;border-radius:15px;padding:14px;font-size:15px;margin-bottom:9px}
html.night .field{background:#100E1A}
.field-row{display:flex;gap:9px}
.swatch{width:36px;height:36px;border-radius:12px;padding:0}
.wave{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:40px;margin:6px 0 12px}
.wave i{width:4px;border-radius:2px;background:linear-gradient(180deg,var(--pink),var(--violet));animation:bar .95s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.22s}
.wave i:nth-child(4){animation-delay:.32s}.wave i:nth-child(5){animation-delay:.16s}
.wave i:nth-child(6){animation-delay:.26s}.wave i:nth-child(7){animation-delay:.06s}
@keyframes bar{0%,100%{height:8px}50%{height:32px}}
.hint{font-size:12.5px;color:var(--text-3);margin-top:12px;line-height:1.45}
.tick{width:22px;height:22px;flex:none;border-radius:8px;background:var(--surface);display:grid;place-items:center;color:transparent;margin-top:1px}
html.night .tick{background:#0B0912}
.tick.on{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}
.note.done p{opacity:.4;text-decoration:line-through}
.foot{text-align:center;padding:4px 0 26px}
.foot button{font-size:12.5px;color:var(--text-3)}
#syncNote{font-size:11.5px;color:var(--text-3);margin:0 0 6px;text-align:center;opacity:.75}
#syncNote:empty{display:none}

/* ---------------- первый запуск ---------------- */
.intro{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;
  padding:0 0 calc(30px + env(safe-area-inset-bottom))}
.intro-hero{position:relative;overflow:hidden;background:#3D1FA8;color:#fff;
  padding:calc(30px + env(safe-area-inset-top)) 22px 34px;border-radius:0 0 30px 30px}
.intro-hero .in{position:relative;z-index:2}
.intro-hero h1{margin:0 0 12px;font-size:32px;font-weight:700;line-height:1.08}
.intro-hero p{margin:0;font-size:15px;color:rgba(255,255,255,.82);max-width:30ch}
.intro-body{padding:24px 18px 0}
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:linear-gradient(90deg,var(--violet),var(--pink))}
.intro h2{margin:0 0 6px;font-size:22px;font-weight:600}
.intro .lead{margin:0 0 20px;font-size:14px;color:var(--text-3);line-height:1.5}
.two-up{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.up{background:var(--surface);border-radius:20px;padding:16px 14px;text-align:left;display:block}
html.night .up{border:1px solid var(--line)}
.up .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--violet),var(--pink));margin-bottom:11px}
.up b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.up span{display:block;font-size:12px;color:var(--text-3);margin-top:3px;overflow-wrap:anywhere}
.up.live .ic{background:linear-gradient(135deg,#FF3B5C,#FF6B4A)}
.up:active{transform:scale(.98)}
.mic-cta{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:8px}
.mic-cta.live{background:linear-gradient(135deg,#FF3B5C,#FF6B4A)}
.mic-cta .ring{width:44px;height:44px;border-radius:16px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
.mic-cta b{display:block;font-size:15px;font-weight:600}
.mic-cta span{display:block;font-size:12.5px;color:rgba(255,255,255,.8);margin-top:2px}
.heard{background:var(--surface);border-radius:16px;padding:13px 15px;font-size:14px;margin-bottom:14px;color:var(--text-2)}
.heard b{display:block;font-size:11.5px;color:var(--text-3);font-weight:500;margin-bottom:4px}
.added{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.added-item{display:flex;align-items:center;gap:11px;background:var(--surface);border-radius:16px;padding:13px 15px}
html.night .added-item{border:1px solid var(--line)}
.added-item .txt{flex:1;min-width:0}
.added-item .txt b{display:block;font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.added-item .txt span{display:block;font-size:12.5px;color:var(--text-3);margin-top:1px;overflow-wrap:anywhere}
.added-item .del{color:var(--text-3);padding:4px;flex:none}
.form-card{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:14px}
html.night .form-card{border:1px solid var(--line)}
.form-card .field{background:var(--surface-2)}
html.night .form-card .field{background:#100E1A}
.form-card .field:last-of-type{margin-bottom:0}
.row-mic{display:flex;gap:9px;align-items:center;margin-top:12px}
.row-mic .primary{margin-top:0;flex:1}
.or{text-align:center;font-size:12.5px;color:var(--text-3);margin:14px 0}

/* ---------------- разбор диктовки ---------------- */
.rv{background:var(--surface-2);border-radius:18px;padding:14px;margin-bottom:10px}
html.night .rv{background:#100E1A}
.rv-head{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.rv-tag{font-size:11.5px;font-weight:600;border-radius:8px;padding:4px 9px}
.rv-head .del{margin-left:auto;color:var(--text-3);padding:4px;flex:none}
.rv .field{background:var(--sheet);margin-bottom:8px}
html.night .rv .field{background:#1B1729}
.rv .field:last-child{margin-bottom:0}
.rv textarea{width:100%;background:var(--sheet);border:0;border-radius:14px;padding:12px 13px;
  font-size:14.5px;min-height:66px;resize:none;margin-bottom:9px;line-height:1.4}
html.night .rv textarea{background:#1B1729}
select.field{appearance:none;-webkit-appearance:none;background-image:none}
.asr-box:empty:before{content:attr(data-ph);color:var(--text-3)}
.asr-box{background:var(--surface-2);border-radius:18px;padding:15px;min-height:110px;
  font-size:15px;color:var(--text);line-height:1.5;margin-bottom:12px}
html.night .asr-box:empty:before{content:attr(data-ph);color:var(--text-3)}
.asr-box{background:#100E1A}
.asr-box:empty::before{content:"Здесь появится то, что вы говорите";color:var(--text-3)}
.asr-box[contenteditable]:focus{outline:2px solid var(--violet);outline-offset:2px}
.rv-summary{font-size:13px;color:var(--text-3);margin:0 0 16px}
</style>
</head>
<body>

<div class="intro" id="intro" hidden></div>

<div id="app" hidden>
  <header class="hero">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="hero-in">
      <div class="hero-top">
        <span class="date" id="heroDate"></span>
        <div class="hero-tools">
          <button class="theme-btn" id="bellBtn" aria-label="Утренняя сводка"></button>
          <button class="theme-btn" id="themeBtn" aria-label="Сменить тему">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button class="mini-btn" id="resetBtn" aria-label="Сбросить все данные">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>
      </div>
      <div id="heroBody"></div>
    </div>
  </header>

  <div class="wrap">
    <button class="day-pill" id="dayNotesBtn">
      <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12l3 3 5-6"/></svg></span>
      <span class="label">Заметки на день<small id="dayNotesSub">ничего не записано</small></span>
      <span class="badge zero" id="dayNotesCount">0</span>
    </button>

    <div class="sec-head">
      <h2>Предметы</h2>
      <button class="add-btn" id="addSubjectBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Добавить</button>
    </div>
    <section class="card">
      <div class="thead" id="thead"><div><span class="w-narrow">Предмет и преподаватель</span><span class="w-wide">Предмет</span></div><div>Преподаватель</div><div>Ауд.</div><div></div></div>
      <div id="subjectList"></div>
    </section>

    <div class="sec-head">
      <h2>Расписание</h2>
      <button class="add-btn" id="addLessonBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Пара</button>
    </div>
    <section class="card">
      <div class="week-nav" id="weekNav"></div>
      <div class="week" id="week"></div>
      <div class="timeline" id="timeline"></div>
    </section>

  </div>

  <div class="actions" id="actions">
    <button class="act" id="recBtn">
      <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></span>
      <span class="lb" id="recLabel">Продиктовать</span>
    </button>
    <button class="act" id="importBtn">
      <span class="ic"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></span>
      <span class="lb">Загрузить файл</span>
    </button>
  </div>
</div>

<input type="file" id="fileInput" hidden accept=".pdf,.docx,.xlsx,.xls,.csv,.txt">
<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>

<script>
"use strict";

/* ---------------- хранилище ---------------- */
/* Локальная память устройства — основная. Telegram CloudStorage — фоновая
   синхронизация между устройствами. При плохой связи работает первая. */
const KEY = "uni_app_v3";
const mem = {};
const cloud = tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;
let syncPending = false;
let booted = false;

function readLocal(){
  try {
    const raw = window.localStorage.getItem(KEY);
    if (!raw) return null;
    mem[KEY] = raw;
    return JSON.parse(raw);
  } catch(e){ return mem[KEY] ? JSON.parse(mem[KEY]) : null; }
}
function writeLocal(raw){
  mem[KEY] = raw;
  try { window.localStorage.setItem(KEY, raw); } catch(e){}
}
/* Облако Telegram хранит не больше 4096 символов в одном ключе, а расписание
   после импорта весит в разы больше. Поэтому данные режутся на части.
   Пишем в запасной комплект ключей, и только когда все части легли —
   переключаем указатель (_meta). Так в облаке всегда лежит целая копия. */
const CHUNK = 3800;
let cloudGen = "a", cloudBusy = false, cloudAgain = false;
function pushCloud(){
  if (!cloud || !mem[KEY]) return;
  if (cloudBusy){ cloudAgain = true; return; }
  cloudBusy = true; cloudAgain = false;
  const raw = mem[KEY];
  const parts = [];
  for (let i = 0; i < raw.length; i += CHUNK) parts.push(raw.slice(i, i + CHUNK));
  const gen = cloudGen === "a" ? "b" : "a";
  const finish = ok => {
    syncPending = !ok; updateSyncNote();
    cloudBusy = false;
    if (cloudAgain) pushCloud();
  };
  if (parts.length > 400) return finish(false);
  let left = parts.length, failed = false;
  try {
    parts.forEach((p, i) => cloud.setItem(KEY + "_" + gen + "_" + i, p, err => {
      if (err) failed = true;
      if (--left) return;
      if (failed) return finish(false);
      const meta = JSON.stringify({ g:gen, n:parts.length, updated:(state && state.updated) || Date.now() });
      cloud.setItem(KEY + "_meta", meta, err2 => {
        if (!err2) cloudGen = gen;
        finish(!err2);
      });
    }));
  } catch(e){ finish(false); }
}
/* чтение: сначала указатель, потом все части; для старых версий — один ключ */
function readCloud(cb){
  const single = () => cloud.getItem(KEY, (e, v) => {
    let r = null; try { r = v ? JSON.parse(v) : null; } catch(x){}
    cb(e ? undefined : r);
  });
  try {
    cloud.getItem(KEY + "_meta", (err, m) => {
      if (err) return cb(undefined);
      let meta = null; try { meta = m ? JSON.parse(m) : null; } catch(x){}
      if (!meta || !meta.n) return single();
      cloudGen = meta.g;
      const keys = [];
      for (let i = 0; i < meta.n; i++) keys.push(KEY + "_" + meta.g + "_" + i);
      const out = {};
      let batches = [], pending;
      for (let i = 0; i < keys.length; i += 20) batches.push(keys.slice(i, i + 20));
      pending = batches.length;
      let bad = false;
      batches.forEach(b => cloud.getItems(b, (e, vals) => {
        if (e || !vals) bad = true; else Object.assign(out, vals);
        if (--pending) return;
        if (bad) return cb(undefined);
        const raw = keys.map(k => out[k] || "").join("");
        try { cb(JSON.parse(raw)); } catch(x){ cb(undefined); }
      }));
    });
  } catch(e){ cb(undefined); }
}
function updateSyncNote(){
  const el = document.getElementById("syncNote");
  if (el) el.textContent = syncPending ? "Сохранено на устройстве, синхронизация ждёт сети" : "";
}

function load(cb){
  const local = readLocal();
  if (local){ booted = true; cb(local); }
  if (!cloud){ if (!local) cb(null); return; }
  readCloud(remote => {
    /* undefined — облако не ответило; null — там пусто */
    if (remote === undefined) remote = null;
    if (!booted){ booted = true; return cb(remote); }
    const mine = state ? (state.updated || 0) : 0;
    const theirs = remote ? (remote.updated || 0) : 0;
    if (remote && theirs > mine && intro.hidden){
      /* на другом устройстве данные свежее — подхватываем */
      state = remote;
      writeLocal(JSON.stringify(remote));
      renderAll();
    } else if (mine > theirs){
      pushCloud();
    }
  });
}

/* ---------------- утренняя сводка: выжимка для сервера ----------------
   Сервер знает только расписание и заголовки срочных задач — больше ему
   для сводки ничего не нужно. Подпись Telegram доказывает, чьи это данные. */
let serverTimer = null, serverState = { ok:null, error:"" };
function serverSnapshot(){
  const today = iso(new Date());
  return {
    tz: (Intl.DateTimeFormat().resolvedOptions().timeZone) || "Europe/Moscow",
    notify: state.notify !== false,
    subjects: state.subjects.map(x => ({ id:x.id, name:x.name, room:x.room || "" })),
    lessons: state.lessons.filter(l => !l.date || l.date >= today).map(l => ({
      date:l.date || "", day:l.day, time:l.time, end:l.end || "", subjectId:l.subjectId, room:l.room || "", kind:l.kind || ""
    })),
    urgent: state.dayNotes.filter(n => n.quad === 0 && !n.done).map(n => (n.title || n.text || "").trim()).filter(Boolean)
  };
}
function pushServer(test){
  if (!(tg && tg.initData)){
    serverState = { ok:false, error:"Сводка работает, когда приложение открыто из Telegram." };
    renderNotify();
    return Promise.resolve(serverState);
  }
  return fetch("/api/sync", {
    method:"POST", headers:{ "content-type":"application/json" },
    body: JSON.stringify({ initData: tg.initData, snapshot: serverSnapshot(), test: !!test })
  })
  .then(r => r.json().catch(() => ({ ok:false, error:"Сервер ответил не так, как ожидалось (HTTP " + r.status + ")" })))
  .catch(() => ({ ok:false, error:"Нет связи с сервером." }))
  .then(j => { serverState = { ok:!!j.ok, error:j.error || j.lastError || "" }; renderNotify(); return serverState; });
}
function schedulePush(){ clearTimeout(serverTimer); serverTimer = setTimeout(() => pushServer(false), 1500); }

/* ---------------- разбор речи ---------------- */
function parseSubject(text){
  let t = String(text).trim().replace(/\s+/g," ").replace(/[.!?]+$/,"");
  let parts = t.split(/\s*[,;]\s*|\s+запятая\s+/i).map(s => s.trim()).filter(Boolean);
  let name = "", teacher = "", room = "";
  if (parts.length >= 2){
    name = parts[0]; teacher = parts[1]; room = parts[2] || "";
  } else {
    let m = t.match(/(?:ауд(?:итория|\.)?|кабинет|каб\.?|корпус|зал)\s*[№#]?\s*([А-Яа-яЁёA-Za-z0-9\-]+)/i);
    if (m){ room = m[1]; t = t.replace(m[0], " "); }
    else { m = t.match(/(?:^|\s)(\d{2,4}[а-яА-Я]?)(?=\s|$)/); if (m){ room = m[1]; t = t.replace(m[0], " "); } }
    m = t.match(/(?:препод(?:аватель|авателем)?|ведёт|ведет|у)\s+([А-ЯЁ][а-яё]+(?:\s+[А-ЯЁ][а-яё]*\.?){0,2})/);
    if (m){ teacher = m[1]; t = t.replace(m[0], " "); }
    name = t.replace(/\s+/g," ").trim();
  }
  room = room.replace(/^(ауд(итория)?\.?|кабинет|каб\.?|зал)\s*[№#]?\s*/i, "").trim();
  return { name:cap(name), teacher:cap(teacher), room:room };
}
function parseLesson(text){
  const low = String(text).toLowerCase();
  let day = null;
  DAY_KEYS.forEach((keys, i) => { if (keys.some(k => low.indexOf(k) >= 0)) day = i; });
  let time = null;
  let m = low.match(/(\d{1,2})\s*[:.]\s*(\d{2})/);
  if (m) time = pad(+m[1]) + ":" + m[2];
  if (!time){
    m = low.match(/(?:в|с)\s+(\d{1,2})(?!\d)/);
    if (m) time = pad(+m[1]) + ":00";
  }
  if (!time){
    for (const w in WORDNUM){
      if (low.indexOf(" " + w) >= 0 || low.indexOf("в " + w) >= 0){ time = pad(WORDNUM[w]) + ":00"; break; }
    }
  }
  let subjectId = null;
  let best = 0;
  state.subjects.forEach(s => {
    const key = s.name.toLowerCase().slice(0, Math.min(5, s.name.length));
    if (key && low.indexOf(key) >= 0 && key.length > best){ best = key.length; subjectId = s.id; }
  });
  return { day, time, subjectId };
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* склеиваем куски по номерам и снимаем подряд идущие повторы фраз */
/* ---------------- сборка распознанного текста ----------------
   Каждый кусок речи получает сквозной номер: НОМЕР СЕССИИ + НОМЕР ВНУТРИ НЕЁ.
   Сессия меняется при каждом перезапуске после паузы. Такой номер уникален,
   поэтому повторная присылка того же куска просто перезаписывает свою ячейку,
   а не добавляет новую. Плюс два фильтра: уже звучавшие завершённые куски
   из прошлых сессий отсеиваются по содержимому, а на склейке снимается нахлёст. */
const kw = x => String(x).toLowerCase().replace(/ё/g,"е").replace(/[^а-яa-z0-9]/gi,"");

function segReset(){ segs = new Map(); segSid = 0; segSeen = new Set(); }
function segPut(idx, text, final){
  if (!String(text).trim()) return;
  /* кусок, который уже звучал в прошлых сессиях, — это повтор, а не новая речь */
  if (final && segSid > 0 && segSeen.has(kw(text))) return;
  segs.set(segSid + ":" + idx, { s:segSid, i:idx, t:String(text), final:!!final });
}
function segNextSession(){
  segs.forEach(v => { if (v.final) segSeen.add(kw(v.t)); });
  segSid++;
}
function joinNoOverlap(a, b){
  const A = a.split(" ").filter(Boolean), B = b.split(" ").filter(Boolean);
  if (!A.length) return B.join(" ");
  if (!B.length) return A.join(" ");
  for (let k = Math.min(A.length, B.length); k >= 1; k--){
    let same = true;
    for (let i = 0; i < k; i++){
      if (kw(A[A.length - k + i]) !== kw(B[i])){ same = false; break; }
    }
    if (same) return A.concat(B.slice(k)).join(" ");
  }
  return A.concat(B).join(" ");
}
/* подряд идущие одинаковые куски речи (от трёх слов) сворачиваем в один */
function dedupe(t){
  const w = t.split(" ").filter(Boolean);
  for (let len = Math.floor(w.length / 2); len >= 3; len--){
    for (let i = 0; i + 2 * len <= w.length; i++){
      const a = w.slice(i, i + len).map(kw).join(" ");
      let j = i + len;
      while (j + len <= w.length && w.slice(j, j + len).map(kw).join(" ") === a) j += len;
      if (j > i + len){ w.splice(i + len, j - i - len); return dedupe(w.join(" ")); }
    }
  }
  return w.join(" ");
}
function collectText(){
  const list = Array.from(segs.values()).sort((x,y) => x.s - y.s || x.i - y.i);
  let out = "";
  list.forEach(v => { out = joinNoOverlap(out, v.t.replace(/\s+/g," ").trim()); });
  return dedupe(out).trim();
}
function startRec(sinkFn, endFn){
  if (!SR) return false;
  /* если предыдущий экземпляр ещё жив, он продолжал бы писать в тот же буфер
     и текст удваивался бы — глушим его до создания нового */
  if (rec){ rec.onresult = null; rec.onend = null; rec.onerror = null; try { rec.stop(); } catch(e){} rec = null; }
  segReset(); restarts = 0; manualStop = false; restarting = false;
  sink = sinkFn; onRecEnd = endFn || null;
  try { rec = new SR(); } catch(e){ return false; }
  rec.lang = "ru-RU"; rec.continuous = true; rec.interimResults = true;
  rec.onstart = () => { restarting = false; };
  rec.onresult = e => {
    /* куски, долетевшие в момент перезапуска, уже учтены в копилке — пропускаем */
    restarting = false;
    for (let i = e.resultIndex; i < e.results.length; i++){
      segPut(i, e.results[i][0].transcript, e.results[i].isFinal);
    }
    if (sink) sink(collectText(), false);
  };
  rec.onerror = ev => {
    if (ev.error === "no-speech" || ev.error === "aborted" || ev.error === "network") return;
    showRecError(ev.error === "not-allowed"
      ? "Нет доступа к микрофону — разрешите его или введите текст."
      : "Распознавание прервалось (" + (ev.error || "без кода") + "). Можно продолжить текстом.");
    manualStop = true;
    stopRec(true);
  };
  rec.onend = () => {
    if (!recording || manualStop) return;
    /* обрыв по тишине: переносим готовое в копилку и поднимаем ТОТ ЖЕ экземпляр,
       не создавая новый — новый вебвью воспринял бы как новый запрос микрофона */
    segNextSession();
    restarting = true;
    if (++restarts > 60){ stopRec(false); return; }
    try { rec.start(); } catch(e){ stopRec(false); }
  };
  try { rec.start(); } catch(e){ return false; }
  recording = true;
  syncRecUI();
  return true;
}
function stopRec(silent){
  manualStop = true;
  if (rec){ rec.onresult = null; rec.onend = null; rec.onerror = null; try { rec.stop(); } catch(e){} }
  rec = null;
  const wasRecording = recording;
  recording = false;
  syncRecUI();
  if (wasRecording && sink) sink(collectText(), true);
  if (wasRecording && onRecEnd) onRecEnd(collectText());
  if (!silent) buzz("rigid");
}

/* Пара может быть привязана к конкретной дате (импорт из файла)
   или повторяться каждую неделю (добавлена руками). */
let weekOffset = 0;
function mondayOf(offset){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - todayIdx() + (offset || 0) * 7);
  return d;
}
function dateOfDay(i, offset){
  const d = mondayOf(offset === undefined ? weekOffset : offset);
  d.setDate(d.getDate() + i);
  return d;
}
const iso = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
function lessonsFor(dayIdx, offset){
  const key = iso(dateOfDay(dayIdx, offset));
  return state.lessons
    .filter(l => l.date ? l.date === key : l.day === dayIdx)
    .sort((a,b) => minutes(a.time) - minutes(b.time));
}
function renderHero(){
  const d = new Date();
  const idx = todayIdx();
  const nowMin = d.getHours()*60 + d.getMinutes();
  document.getElementById("heroDate").textContent = DAYS_SHORT[idx] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
  const box = document.getElementById("heroBody");

  if (!state.subjects.length){
    box.innerHTML = '<p class="status">Пустой старт</p><h1>Добавьте первый предмет</h1>' +
      '<div class="hero-meta">Кнопка «Добавить» ниже или микрофон в углу</div>';
    return;
  }
  const list = lessonsFor(idx, 0);
  if (!list.length){
    box.innerHTML = '<p class="status">Свободный день</p><h1>Пар сегодня нет</h1>' +
      '<div class="hero-meta">Хороший повод разобрать заметки и закрыть долги</div>';
    return;
  }
  const live = list.find(l => nowMin >= minutes(l.time) && nowMin < minutes(l.end || l.time));
  const next = list.find(l => minutes(l.time) > nowMin);
  const target = live || next;
  if (!target){
    const last = list[list.length-1];
    const s = subjById(last.subjectId);
    box.innerHTML = '<p class="status">Пары закончились</p>' +
      '<h1>' + list.length + " " + plural(list.length,"пара","пары","пар") + ' позади</h1>' +
      '<div class="hero-meta">Последней была ' + esc(s ? s.name : "пара") + '</div>';
    return;
  }
  const s = subjById(target.subjectId);
  const start = minutes(target.time), end = minutes(target.end || target.time);
  const pct = live && end > start ? Math.min(100, ((nowMin - start) / (end - start)) * 100) : 0;
  box.innerHTML =
    (live ? '<p class="status"><span class="live-dot"></span>Идёт сейчас</p>'
          : '<p class="status">Дальше, через ' + minWord(start - nowMin) + '</p>') +
    '<h1>' + esc(s ? s.name : "Пара") + '</h1>' +
    '<div class="hero-meta">' + (s && s.room ? '<span class="tag">ауд. ' + esc(s.room) + '</span>' : "") +
      '<span>' + esc(s && s.teacher ? s.teacher : "преподаватель не указан") + '</span></div>' +
    '<div class="bar"><i id="heroBar"></i></div>' +
    '<div class="bar-labels"><span>' + target.time + '</span><b>' +
      (live ? "осталось " + minWord(Math.max(0, end - nowMin)) : "начало в " + target.time) +
    '</b><span>' + (target.end || "") + '</span></div>';
  requestAnimationFrame(() => { const bar = document.getElementById("heroBar"); if (bar) bar.style.width = pct + "%"; });
}

function addNote(scope, ownerId, text){
  const t = (text || "").trim();
  if (!t) return;
  const note = { id:uid(), text:t, ts:Date.now() };
  if (scope === "subject"){ const s = subjById(ownerId); if (s){ s.notes.unshift(note); openSubjects.add(ownerId); } }
  else if (scope === "lesson"){ const l = state.lessons.find(x => x.id === ownerId); if (l){ l.notes.unshift(note); openLessons.add(ownerId); } }
  else { note.done = false; state.dayNotes.unshift(note); }
  save(); buzz("light"); renderAll();
  if (scope === "day" && sheetOpen === "day") openDayNotes();
}

const shade = document.getElementById("shade");
const sheet = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");

function showSheet(html, name){

    const mark = () => { el.classList.toggle("more", el.scrollHeight - el.scrollTop - el.clientHeight > 4); el.classList.toggle("top", el.scrollTop > 4); };
    mark(); requestAnimationFrame(mark); el.addEventListener("scroll", mark, { passive:true });
  });

}
/* заметки на день: свайп влево — матрица, вправо — список */
let swX = 0, swY = 0, swT = 0, swOk = false;
sheetBody.addEventListener("touchstart", e => {
  swOk = sheetOpen === "day" && e.touches.length === 1 && !e.target.closest("textarea, input, [contenteditable]");
  if (!swOk) return;
  swX = e.touches[0].clientX; swY = e.touches[0].clientY; swT = Date.now();
}, { passive:true });
sheetBody.addEventListener("touchmove", () => { if (dragNote) swOk = false; }, { passive:true });
sheetBody.addEventListener("touchend", e => {
  if (!swOk || dragNote || Date.now() - justDragged < 500) return;
  swOk = false;
  const t = e.changedTouches[0], dx = t.clientX - swX, dy = t.clientY - swY;
  if (Date.now() - swT > 700 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  const to = dx < 0 ? "matrix" : "list";
  if (dayView() === to) return;
  setDayView(to); buzz("light"); openDayNotes();
  sheetBody.classList.remove("sw-l", "sw-r"); void sheetBody.offsetWidth;
  sheetBody.classList.add(dx < 0 ? "sw-l" : "sw-r");
}, { passive:true });
function closeSheet(){

}

/* выбор вида заметок: обычный список или матрица Эйзенхауэра */

/* ---------------- перетаскивание пунктов матрицы ----------------
   Долгое нажатие на плашку поднимает её, дальше палец ведёт копию,
   квадрант под пальцем подсвечивается, отпускание переносит пункт. */
let dragNote = null, dragGhost = null, dragTimer = null, dragFrom = null, dragOver = null;

function quadUnder(x, y){
  const qs = document.querySelectorAll(".quad");
  for (let i = 0; i < qs.length; i++){
    const r = qs[i].getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return qs[i];
  }
  return null;
}
function dragCancel(){
  clearTimeout(dragTimer); dragTimer = null;
  if (dragGhost){ dragGhost.remove(); dragGhost = null; }
  if (dragOver) dragOver.classList.remove("drop");
  document.querySelectorAll(".lift").forEach(el => el.classList.remove("lift"));
  document.body.classList.remove("dragging");
  dragNote = null; dragFrom = null; dragOver = null;
}
function dragBegin(el, id, x, y){
  dragNote = id; dragFrom = el;
  el.classList.add("lift");
  document.body.classList.add("dragging");
  const r = el.getBoundingClientRect();
  dragGhost = el.cloneNode(true);
  dragGhost.className = (el.classList.contains("uchip") ? "uchip" : "qnote") + " ghost";
  dragGhost.style.cssText = "position:fixed;z-index:200;pointer-events:none;width:" + r.width + "px;" +
    "left:" + r.left + "px;top:" + r.top + "px;";
  dragGhost.dataset.dx = (x - r.left); dragGhost.dataset.dy = (y - r.top);
  document.body.appendChild(dragGhost);
  buzz("medium");
}
function dragMove(x, y){
  if (!dragGhost) return;
  dragGhost.style.left = (x - dragGhost.dataset.dx) + "px";
  dragGhost.style.top  = (y - dragGhost.dataset.dy) + "px";
  const q = quadUnder(x, y);
  if (q !== dragOver){
    if (dragOver) dragOver.classList.remove("drop");
    if (q) q.classList.add("drop");
    dragOver = q;
  }
}
function dragDrop(){
  const id = dragNote, target = dragOver;
  if (id && target){
    const k = +target.dataset.quad;
    const n = state.dayNotes.find(x => x.id === id);
    if (n && n.quad !== k){ n.quad = k; save(); buzz("rigid"); dragCancel(); renderAll(); openDayNotes(); return; }
  }
  dragCancel();
}
/* Что можно тащить: пункт квадранта или плашку «не разложено» */
function dragSource(target){
  const chip = target.closest(".uchip");
  if (chip) return { el:chip, id:chip.dataset.sort };
  const el = target.closest(".qnote");
  if (!el || target.closest(".qtick, .qacts")) return null;
  const t = el.querySelector("[data-open-note]");
  return t ? { el:el, id:t.dataset.openNote } : null;
}
const SLOP = 10;               /* дрожание пальца до 10px не отменяет зажатие */
let pressX = 0, pressY = 0, justDragged = 0;
function pressStart(target, x, y){
  const src = dragSource(target);
  if (!src) return;
  pressX = x; pressY = y;
  clearTimeout(dragTimer);
  dragTimer = setTimeout(() => {
    dragTimer = null;
    try { window.getSelection().removeAllRanges(); } catch(e){}
    dragBegin(src.el, src.id, x, y);
  }, 420);
}
function pressMove(x, y){
  if (dragNote){ dragMove(x, y); return true; }
  if (dragTimer && Math.hypot(x - pressX, y - pressY) > SLOP){ clearTimeout(dragTimer); dragTimer = null; }
  return false;
}
function pressEnd(){
  clearTimeout(dragTimer); dragTimer = null;
  if (!dragNote) return false;
  justDragged = Date.now();
  dragDrop();
  return true;
}

/* Телефон: сенсорные события. Перетаскивание перехватывает касание целиком —
   браузер не прокручивает лист и не выделяет текст под пальцем. */
document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  pressStart(e.target, t.clientX, t.clientY);
}, { passive:true });
document.addEventListener("touchmove", e => {
  const t = e.touches[0];
  if (t && pressMove(t.clientX, t.clientY)) e.preventDefault();
  else if (dragNote) e.preventDefault();
}, { passive:false });
document.addEventListener("touchend", e => { if (pressEnd()) e.preventDefault(); }, { passive:false });
document.addEventListener("touchcancel", () => { clearTimeout(dragTimer); dragTimer = null; dragCancel(); });

/* Компьютер: мышь */
document.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") pressStart(e.target, e.clientX, e.clientY); });
document.addEventListener("pointermove", e => { if (e.pointerType === "mouse") pressMove(e.clientX, e.clientY); }, { passive:true });
document.addEventListener("pointerup", e => { if (e.pointerType === "mouse") pressEnd(); });

/* долгое нажатие не открывает системное меню «Копировать / Выделить всё» */
document.addEventListener("contextmenu", e => {
  if (e.target.closest(".qnote, .uchip, .quad") || dragNote) e.preventDefault();
});
/* клик, прилетевший сразу после перетаскивания, не должен открыть заметку */
document.addEventListener("click", e => {
  if (Date.now() - justDragged < 400){ e.stopPropagation(); e.preventDefault(); }
}, true);

/* экран одной заметки */
function openNoteView(id, back){
  const n = state.dayNotes.find(x => x.id === id);
  if (!n) return openDayNotes();
  const q = (n.quad === undefined || n.quad === null) ? null : QUADS[n.quad];
  showSheet('<button class="ghost-link back" id="nvBack">' + ICON.left + ' Назад</button>' +
    '<div class="nvcard' + (n.done ? " done" : "") + '"' + (q ? ' style="--qc:' + q.color + '"' : "") + '>' +
      '<div class="nvtop">' +
        '<button class="nvtick' + (n.done ? " on" : "") + '" id="nvDone" aria-label="' +
          (n.done ? "Вернуть в работу" : "Отметить выполненной") + '">' + ICON.tick + '</button>' +
        (q ? '<span class="qtag" style="--qc:' + q.color + '">' + q.crit + '</span>'
           : '<span class="qtag none">Не разложено</span>') +
      '</div>' +
      '<textarea class="nvt" id="nvTitle" rows="1" placeholder="Заголовок">' + esc(noteTitle(n)) + '</textarea>' +
      '<textarea class="nvbody" id="nvBody" rows="2" placeholder="Нажмите, чтобы дописать подробности">' + esc(noteBody(n)) + '</textarea>' +
      '<p class="nvtime">' + when(n.ts) + '</p>' +
    '</div>' +
    '<button class="ghost" id="nvMove">' + (q ? "Переместить в другой квадрант" : "Разложить по квадрантам") + '</button>' +
    '<button class="ghost-link danger" id="nvDel">Удалить заметку</button>', "note-view");

  const home = back || openDayNotes;
  document.getElementById("nvBack").onclick = () => { document.activeElement && document.activeElement.blur(); renderAll(); home(); };
  document.getElementById("nvDone").onclick = () => {
    n.done = !n.done; save(); buzz("light"); renderAll(); openNoteView(id, back);
  };
  /* правка прямо в карточке: нажали — клавиатура, всё сохраняется по ходу набора */
  const ti = document.getElementById("nvTitle"), bo = document.getElementById("nvBody");
  const grow = el => { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; };
  let tmr = null;
  const commit = () => {
    const t = ti.value.replace(/\s+/g, " ").trim();
    if (t) { n.title = t; delete n.text; }
    n.body = bo.value.trim();
    save(); renderDayPill();
  };
  [ti, bo].forEach(el => {
    grow(el);
    el.addEventListener("input", () => { grow(el); clearTimeout(tmr); tmr = setTimeout(commit, 400); });
    el.addEventListener("blur", () => { clearTimeout(tmr); commit(); });
  });
  /* перенос строки в заголовке не нужен — Enter переводит к подробностям */
  ti.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); bo.focus(); } });
  ti.addEventListener("blur", () => { if (!ti.value.trim()) ti.value = noteTitle(n); });
  document.getElementById("nvMove").onclick = () => openQuadPick(id, null, () => openNoteView(id, back));
  document.getElementById("nvDel").onclick = () => {
    state.dayNotes = state.dayNotes.filter(x => x.id !== id);
    save(); buzz("medium"); renderAll(); home();
  };
}

const NUM_STEMS = [
  ["одиннадцат",11],["двенадцат",12],["тринадцат",13],["четырнадцат",14],["пятнадцат",15],
  ["шестнадцат",16],["семнадцат",17],["восемнадцат",18],["девятнадцат",19],

  ["шест",6],["седьм",7],["сем",7],["восьм",8],["восем",8],["девят",9],["десят",10],
  ["один",1],["дв",2],["тр",3]
];
const norm = s => String(s).toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim();
const titleCase = s => s.split(/\s+/).map(w => cap(w.toLowerCase())).join(" ");

function wordNum(tokens){
  let total = 0, found = false;
  tokens.forEach(tok => {
    let s = norm(tok).replace(/[^а-я]/g,"");
    let guard = 0;
    while (s.length > 1 && guard++ < 3){
      let hit = null;
      for (let i = 0; i < NUM_STEMS.length; i++){
        if (s.indexOf(NUM_STEMS[i][0]) === 0){ hit = NUM_STEMS[i]; break; }
      }
      if (!hit) break;
      total += hit[1]; found = true;
      s = s.slice(hit[0].length);
    }
  });
  return found && total > 0 ? total : null;
}
function extractRoom(text){
  let m = text.match(/(?:кабинет[а-яё]*|аудитори[а-яё]*|ауд\.?|каб\.?)\s*(?:номер\s*)?№?\s*(\d{1,4}[а-яА-Я]?)/i);
  if (m) return { room:m[1], rest:text.replace(m[0]," ") };
  m = text.match(/(\d{1,4}[а-яА-Я]?)\s*(?:-?[йыоая]\s*)?(?:кабинет[а-яё]*|аудитори[а-яё]*)/i);
  if (m) return { room:m[1], rest:text.replace(m[0]," ") };
  const isNum = t => !!wordNum([t]);
  m = text.match(/((?:[а-яёА-ЯЁ]+\s+){1,3})(кабинет[а-яё]*|аудитори[а-яё]*)/i);
  if (m){
    const toks = m[1].trim().split(/\s+/);
    for (let k = toks.length; k >= 1; k--){
      const tail = toks.slice(toks.length - k);
      if (!tail.every(isNum)) continue;
      const n = wordNum(tail);
      if (!n) continue;
      const keep = toks.slice(0, toks.length - k).join(" ");
      return { room:String(n), rest:text.replace(m[0], " " + keep + " ") };
    }
  }
  /* числительные без слова «кабинет»: «пятьсот девятнадцатая» */
  const toksAll = text.split(/\s+/).filter(Boolean);
  for (let start = 0; start < toksAll.length; start++){
    for (let len = Math.min(3, toksAll.length - start); len >= 2; len--){
      const run = toksAll.slice(start, start + len);
      if (!run.every(isNum)) continue;
      const n = wordNum(run);
      if (!n || n < 100 || n > 9999) continue;
      const rest = toksAll.slice(0, start).concat(toksAll.slice(start + len)).join(" ");
      return { room:String(n), rest:rest };
    }
  }
  m = text.match(/(кабинет[а-яё]*|аудитори[а-яё]*)\s+((?:[а-яёА-ЯЁ]+\s*){1,3})/i);
  if (m){
    const toks = m[2].trim().split(/\s+/);
    for (let k = toks.length; k >= 1; k--){
      const head = toks.slice(0, k);
      if (!head.every(isNum)) continue;
      const n = wordNum(head);
      if (!n) continue;
      const keep = toks.slice(k).join(" ");
      return { room:String(n), rest:text.replace(m[0], " " + keep + " ") };
    }
  }
  return { room:"", rest:text };
}
function extractTeacher(text){
  let m = text.match(/([а-яёА-ЯЁ]{3,})\s+([а-яёА-ЯЁ]{2,})\s+([а-яёА-ЯЁ]+(?:ович|овича|евич|евича|ьич|овна|овны|евна|евны|ична|инична))/i);
  if (m) return { teacher:titleCase(m[0]), rest:text.replace(m[0]," ") };
  m = text.match(/([а-яёА-ЯЁ]{2,})\s+([а-яёА-ЯЁ]+(?:ович|евич|овна|евна|ична))/i);
  if (m) return { teacher:titleCase(m[0]), rest:text.replace(m[0]," ") };
  m = text.match(/([А-ЯЁ][а-яё]+)\s+([А-ЯЁ]\.\s?[А-ЯЁ]\.)/);
  if (m) return { teacher:m[0].trim(), rest:text.replace(m[0]," ") };
  return { teacher:"", rest:text };
}
function findCourse(text){
  const t = norm(text);
  for (let i = 0; i < state.subjects.length; i++){
    const k = norm(state.subjects[i].name).slice(0, 6);
    if (k.length >= 4 && t.indexOf(k) >= 0) return { existing:state.subjects[i], name:state.subjects[i].name };
  }
  for (let i = 0; i < COURSES.length; i++){
    const k = norm(COURSES[i]).slice(0, 6);
    if (k.length >= 4 && t.indexOf(k) >= 0) return { existing:null, name:cap(COURSES[i]) };
  }
  return null;
}
/* ---------------- разбор с явным адресом ----------------
   Формат: сначала куда, потом что.
     «предмет математика Ларин Николай Васильевич пятьсот девятнадцатая»
     «заметка к математике нужно два титра»
     «заметка на день забрать справку в деканате»                       */
const CMD_RE = /(?:^|[\s,.;!?—-]+)(предмет[а-яё]*|дисциплин[а-яё]*|заметк[а-яё]*|пометк[а-яё]*|напомин[а-яё]*)(?=[\s,:.]|$)/gi;
const DAY_TARGET = /^\s*(?:на\s+)?(?:день|сегодня|дня|завтра)(?=[\s,:.-]|$)[\s,:.-]*/i;
const TO_SUBJ = /^\s*(?:к|ко|по|про|для|об|о)(?=\s)[\s,:.-]*/i;

function stem(w){ return norm(w).replace(/[^а-яa-z0-9]/gi,"").slice(0,5); }
/* ищем в начале текста название уже известного предмета, с поправкой на падежи */
function matchSubjectPrefix(text, extra){
  const pool = state.subjects.map(x => ({ id:x.id, name:x.name }))
    .concat(extra || []);
  const words = text.split(/\s+/).filter(Boolean);
  let best = null;
  pool.forEach(sub => {
    const sw = String(sub.name).split(/\s+/).filter(Boolean);
    if (!sw.length || sw.length > words.length) return;
    for (let n = Math.min(sw.length, words.length); n >= 1; n--){
      let ok = true;
      for (let i = 0; i < n; i++){
        if (!stem(sw[i]) || stem(sw[i]) !== stem(words[i])){ ok = false; break; }
      }
      if (ok && (!best || n > best.n)) best = { sub:sub, n:n };
      if (ok) break;
    }
  });
  if (!best) return null;
  return { sub:best.sub, rest:words.slice(best.n).join(" ").trim() };
}

function analyzeCommands(raw){
  const clean = String(raw).replace(FILLERS," ").replace(/\s+/g," ").trim();
  if (!clean) return null;
  CMD_RE.lastIndex = 0;
  const hits = [];
  let m;
  while ((m = CMD_RE.exec(clean))){
    hits.push({ word:m[1].toLowerCase(), at:m.index + m[0].indexOf(m[1]), len:m[1].length });
  }
  if (!hits.length) return null;

  const items = [];
  const made = [];
  let tmpN = 0;
  hits.forEach((h, k) => {
    const body = clean.slice(h.at + h.len, k + 1 < hits.length ? hits[k+1].at : clean.length)
      .replace(/^[\s,:.-]+/, "").trim();
    if (!body) return;

    if (/^(предмет|дисциплин)/.test(h.word)){
      let rest = body;
      const r = extractRoom(rest); rest = r.rest;
      const t = extractTeacher(rest); rest = t.rest;
      rest = rest.replace(/\bпредмет[а-яё]*|препод[а-яё]*|аудитор[а-яё]*|кабинет[а-яё]*/gi," ")
                 .replace(/[,.;]+/g," ").replace(/\s+/g," ").trim();
      const course = findCourse(rest);
      const name = course ? course.name : cap(rest);
      if (!name && !t.teacher && !r.room) return;
      const tmp = "tmp" + (++tmpN);
      items.push({
        kind:"subject", tmp:tmp,
        existingId: course && course.existing ? course.existing.id : null,
        name:name || "", teacher:t.teacher || "", room:r.room || "",
        color: course && course.existing ? course.existing.color
             : PALETTE[(state.subjects.length + tmpN - 1) % PALETTE.length]
      });
      if (name) made.push({ id:tmp, name:name });
      return;
    }

    /* заметка */
    if (DAY_TARGET.test(body)){
      const txt = body.replace(DAY_TARGET,"").trim();
      if (txt) items.push({ kind:"note", text:cap(txt), target:"day" });
      return;
    }
    const afterPrep = body.replace(TO_SUBJ,"");
    const hit = matchSubjectPrefix(afterPrep, made);
    if (hit && hit.rest){
      items.push({ kind:"note", text:cap(hit.rest), target:hit.sub.id });
      return;
    }
    const course = findCourse(afterPrep);
    if (course && course.existing){
      items.push({ kind:"note", text:cap(afterPrep), target:course.existing.id });
      return;
    }
    items.push({ kind:"note", text:cap(body), target:"day" });
  });
  return items.length ? items : null;
}

function analyze(raw){
  /* если в речи есть явные адреса — разбираем строго по ним */
  const byCommand = analyzeCommands(raw);
  if (byCommand) return byCommand;
  const clean = String(raw).replace(FILLERS," ").replace(/\s+/g," ").trim();
  if (!clean) return [];
  const blocks = clean
    .split(/[.!?;]+|\s(?:а\s+)?(?:дальше|далее|потом|затем|кстати|также|так же|ещё|еще|запиши|запишем|заметка)[,\s]+/i)
    .map(s => s.trim()).filter(s => s.length > 1);

  const items = [];
  let tmpN = 0;
  blocks.forEach(block => {
    const clauses = block.split(/\s*,\s*/).map(s => s.trim()).filter(Boolean);
    let subj = null;
    const notes = [];
    clauses.forEach(cl => {
      let rest = cl;
      const r = extractRoom(rest); rest = r.rest;
      const tch = extractTeacher(rest); rest = tch.rest;
      const stripped = rest.replace(/учебн[а-яё]*\s+курс[а-яё]*|предмет[а-яё]*|препод[а-яё]*/gi," ").replace(/\s+/g," ").trim();
      const course = findCourse(stripped);
      const noteish = CUES.test(cl);
      const words = stripped ? stripped.split(/\s+/).length : 0;

      if (r.room || tch.teacher || course){
        if (!subj) subj = { name:"", teacher:"", room:"", existing:null };
        if (r.room && !subj.room) subj.room = r.room;
        if (tch.teacher && !subj.teacher) subj.teacher = tch.teacher;
        if (course && !subj.name){ subj.name = course.name; subj.existing = course.existing; }
        else if (!course && !subj.name && stripped && words <= 3 && !noteish) subj.name = cap(stripped);
        if (noteish && words >= 2) notes.push(cl);
      } else if (words >= 2 || noteish){
        notes.push(cl);
      }
    });

    if (subj && (subj.name || subj.teacher || subj.room)){
      const tmp = "tmp" + (++tmpN);
      items.push({
        kind:"subject", tmp:tmp,
        existingId: subj.existing ? subj.existing.id : null,
        name: subj.name || "", teacher: subj.teacher || "", room: subj.room || "",
        color: subj.existing ? subj.existing.color : PALETTE[(state.subjects.length + tmpN - 1) % PALETTE.length]
      });
      notes.forEach(n => items.push({ kind:"note", text:cap(n), target: subj.existing ? subj.existing.id : tmp }));
    } else {
      let buf = [], bufTarget = null;
      const flush = () => {
        if (!buf.length) return;
        items.push({ kind:"note", text:cap(buf.join(", ")), target:bufTarget || "day" });
        buf = []; bufTarget = null;
      };
      notes.forEach(n => {
        const c = findCourse(n);
        const target = c && c.existing ? c.existing.id : "day";
        if (bufTarget !== null && target !== bufTarget) flush();
        bufTarget = target;
        buf.push(n);
      });
      flush();
    }
  });
  return items;
}

/* ближайшие две недели, только дни, где есть пары */
function asstDays(){
  const out = [];
  const start = todayIdx();
  for (let k = 0; k < 14 && out.length < 10; k++){
    const idx = (start + k) % 7;
    const off = Math.floor((start + k) / 7);
    const list = lessonsFor(idx, off);
    if (list.length) out.push({ idx:idx, off:off, date:dateOfDay(idx, off), list:list });
  }
  return out;
}
function asstPickDay(){
  const days = asstDays();
  if (!days.length){
    return asstBack('<h3>Пар не нашлось</h3>' +
      '<p class="sub">В ближайшие две недели расписание пустое. Загрузите его файлом или добавьте пары вручную.</p>',
      "assistant", openAssistant);
  }
  asstBack('<h3>На какой день?</h3>' +
    '<div class="pick">' + days.map((d,i) =>
      '<button class="pick-row" data-dayk="' + i + '">' +
        '<span class="ic date"><b>' + d.date.getDate() + '</b></span>' +
        '<span class="tx"><b>' + DAYS_SHORT[d.idx] + ", " + d.date.getDate() + " " + MONTHS[d.date.getMonth()] + '</b>' +
        '<i>' + d.list.length + " " + plural(d.list.length,"пара","пары","пар") + '</i></span>' +
        ICON.right + '</button>').join("") + '</div>', "assistant", openAssistant);
  document.querySelectorAll("[data-dayk]").forEach(b => {
    b.onclick = () => { buzz("light"); asstPickLesson(days[+b.dataset.dayk]); };
  });
}
function asstPickLesson(day){
